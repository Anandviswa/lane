<div id="ln-app">
  <nav id="ln-rail" aria-label="Main">
    <a class="brandmark" href="#/home" title="Orbit">O</a>
    <div id="ln-raillinks" style="display:contents"></div>
    <div class="rl-sp"></div>
    <a class="rl-a" href="#/settings" data-r="settings" id="ln-railsettings"></a>
  </nav>
  <div id="ln-col">
    <header id="ln-top">
      <div class="crumbs" id="ln-crumbs"></div>
      <div class="search">
        <span id="ln-searchic"></span>
        <input id="ln-search" type="text" placeholder="Search projects, tasks, accounts" autocomplete="off" spellcheck="false">
      </div>
      <button class="btn sm" id="ln-viewas" title="See a project the way its customer sees it"></button>
      <button class="iconbtn" id="ln-bell" title="Notifications" aria-label="Notifications"></button>
      <button id="ln-me" title="Switch user" aria-label="Switch user"></button>
    </header>
    <main id="ln-main" tabindex="-1"></main>
    <div id="ln-dayhost" hidden></div>
  </div>
</div>
<div id="ln-portal" hidden></div>
<div id="ln-scrim"></div>
<aside id="ln-drawer" aria-label="Task" role="dialog"></aside>
<div id="ln-modal" role="dialog" aria-modal="true"></div>
<div id="ln-pop" hidden></div>
<div id="ln-toast" role="status" aria-live="polite"></div>
