function cycleBtn(states,cur,onPick){
  var i=0; for(var j=0;j<states.length;j++) if(states[j].v===cur) i=j;
  var st=states[i];
  var b=el("button","pill"+(st.cls?" "+st.cls:""),st.label);
  b.title="Click to change";
  b.addEventListener("click",function(){ onPick(states[(i+1)%states.length].v); });
  return b;
}
var openPlan=null;
/* A step is breached when its date has passed and it still isn't done. That is
   the moment the plan needs a second move, not the moment the month ends. */
function stepState(x){
  if(x.done) return "done";
  if(x.due && x.due < today()) return "missed";
  return "open";
}
function planStats(p){
  var st=p.steps||[], done=0, missed=0;
  st.forEach(function(x){
    if(x.done) done++;
    else if(stepState(x)==="missed") missed++;
  });
  return { total:st.length, done:done, missed:missed,
           pct: st.length ? done/st.length : 0 };
}
/* Top-level steps in order, each trailed by the recovery steps that hang off it. */
function planOrder(p){
  var st=p.steps||[], out=[];
  st.forEach(function(x){
    if(x.parent) return;
    out.push(x);
    st.forEach(function(y){ if(y.parent===x.id) out.push(y); });
  });
  st.forEach(function(y){
    if(y.parent && out.indexOf(y)===-1) out.push(y);   // orphaned by a deleted parent
  });
  return out;
}
function hasRecovery(p,x){
  return (p.steps||[]).some(function(y){ return y.parent===x.id; });
}
var BOOK_STATES=[ {v:"queued",label:"Queued"}, {v:"reading",label:"Reading",cls:"go"}, {v:"done",label:"Done",cls:"ok"} ];
var PROJ_STATES=[ {v:"planned",label:"Planned"}, {v:"active",label:"Active",cls:"go"},
                  {v:"shipped",label:"Shipped",cls:"ok"}, {v:"dropped",label:"Dropped",cls:"off"} ];

/* The plan for one project: the steps, and the second move a breached step earns. */
function planEditor(m,p,k){
  var box=el("div","plan");
  box.appendChild(el("h4","How this gets done"));
  if(!p.steps.length) box.appendChild(el("p","empty","No steps yet. Write the first one below."));

  planOrder(p).forEach(function(x){
    var stt=stepState(x);
    var row=el("div","stp"+(x.done?" is-done":"")+(x.parent?" recov":""));

    var c=el("button","chk"+(x.done?" done":"")); c.innerHTML=tick();
    c.title=x.done?"Reopen":"Mark done";
    c.setAttribute("aria-pressed",x.done?"true":"false");
    c.addEventListener("click",function(){
      x.done=!x.done; x.doneAt=x.done?new Date().toISOString():"";
      touchMonth(k); renderPlanner();
    });
    row.appendChild(c);
    if(x.parent) row.appendChild(el("span","rlab","Recovery"));

    var t=el("input","txt"); t.type="text"; t.value=x.text||"";
    t.placeholder=x.parent?"The second move":"The step";
    t.addEventListener("input",function(){ x.text=t.value; touchMonth(k); });
    row.appendChild(t);

    if(stt==="missed") row.appendChild(el("span","badge missed","Missed"));

    var dd=el("input"); dd.type="date"; dd.value=x.due||""; dd.title="By when";
    dd.addEventListener("change",function(){ x.due=dd.value; touchMonth(k); renderPlanner(); });
    row.appendChild(dd);

    var kb=el("button","kill","\u00D7"); kb.title="Remove step";
    kb.addEventListener("click",function(){
      p.steps=p.steps.filter(function(o){ return o.id!==x.id && o.parent!==x.id; });
      touchMonth(k); renderPlanner();
    });
    row.appendChild(kb);
    box.appendChild(row);

    /* A breached step gets one prompt to name the next move, not a nag on every render. */
    if(stt==="missed" && !hasRecovery(p,x)){
      var fr=el("div","fixrow");
      var fb=el("button","fixbtn","+ Recovery step");
      fb.title="This slipped \u2014 what gets it done anyway?";
      fb.addEventListener("click",function(){
        p.steps.push({ id:uid("st"), text:"", due:"", done:false, doneAt:"", parent:x.id });
        touchMonth(k); renderPlanner();
        var all=document.querySelectorAll("#plProj .stp.recov .txt");
        if(all.length) all[all.length-1].focus();
      });
      fr.appendChild(fb); box.appendChild(fr);
    }
  });

  var add=el("div","stepadd");
  var inp=el("input"); inp.type="text"; inp.placeholder="Add a step \u2014 what has to happen";
  var due=el("input"); due.type="date"; due.title="By when \u00b7 optional";
  due.style.cssText="background:var(--page);border:1px solid var(--edge);border-radius:9px;"+
                    "color:var(--muted);font-family:var(--mono);font-size:11px;padding:7px 8px";
  var btn=el("button","btn","Add");
  function go(){
    var v=inp.value.trim(); if(!v) return;
    p.steps.push({ id:uid("st"), text:v, due:due.value||"", done:false, doneAt:"", parent:"" });
    inp.value=""; due.value=""; touchMonth(k); renderPlanner();
    var f=document.querySelector("#plProj .pj.open .stepadd input[type=text]");
    if(f) f.focus();
  }
  inp.addEventListener("keydown",function(e){ if(e.key==="Enter") go(); });
  due.addEventListener("keydown",function(e){ if(e.key==="Enter") go(); });
  btn.addEventListener("click",go);
  add.appendChild(inp); add.appendChild(due); add.appendChild(btn);
  box.appendChild(add);
  return box;
}

/* ============ sync ============ */
var syncTimer=null;
function configured(){ return !!(cfg.url&&cfg.token); }
function setStatus(k,t,a){
  $("pip").className="pip"+(k?" "+k:"");
  $("statusText").textContent=t;
  $("statusBtn").textContent=a||"";
  $("statusBtn").style.display=a?"inline":"none";
}
/* Re-rendering rebuilds every input, which drops focus and sends the rest of
   what you're typing nowhere. So while a field is focused, hold the render
   until you leave it. */
function editing(){
  var a=document.activeElement;
  return !!(a && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.isContentEditable));
}
var renderHeld=false;
function renderSoon(){
  if(!editing()){ renderAll(); return; }
  if(renderHeld) return;
  renderHeld=true;
  document.addEventListener("focusout",function once(){
    document.removeEventListener("focusout",once);
    renderHeld=false;
    setTimeout(function(){ if(!editing()) renderAll(); },80);
  });
}
function queueSync(){
  if(!configured()) return;
  setStatus("warn","Saved here · syncing…");
  clearTimeout(syncTimer); syncTimer=setTimeout(sync,1500);
}
function syncError(e){
  var m = String((e && e.message) || e || "");
  if(m.indexOf("bad token") > -1)   return "Secret doesn't match";
  if(m.indexOf("Failed to fetch") > -1 || m.indexOf("NetworkError") > -1)
                                    return "Can't reach that URL";
  if(m.indexOf("Unexpected token") > -1 || m.indexOf("JSON") > -1)
                                    return "URL isn't the /exec one";
  return "Couldn't sync";
}

function post(body){
  return fetch(cfg.url,{ method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body) })
    .then(function(r){ return r.json(); });
}
function sync(){
  if(!configured()||state.syncing) return;
  if(!navigator.onLine){ setStatus("warn","Offline · saved on this device"); return; }
  var q=read("day.dirty",[]);
  if(!q.length){ pull(); return; }
  state.syncing=true;
  var isMonth=function(k){ return k.indexOf("__month__:")===0; };
  var payload={ token:cfg.token, action:"save",
    days:q.filter(function(k){return k!=="__lib__"&&!isMonth(k);}).map(function(k){return days[k];}).filter(Boolean) };
  if(q.indexOf("__lib__")>-1) payload.lib=lib;
  var mq=q.filter(isMonth).map(function(k){ return months[k.slice(10)]; }).filter(Boolean);
  if(mq.length) payload.months=mq;

  /* Remember what each record looked like going out. Anything edited while the
     request was in flight has to stay dirty, or that edit never reaches the
     sheet — it just sits on the device looking saved. */
  function stampOf(k){
    if(k==="__lib__") return lib.updated_at||"";
    if(isMonth(k)){ var m=months[k.slice(10)]; return m?(m.updated_at||""):""; }
    var d=days[k]; return d?(d.updated_at||""):"";
  }
  var sentStamp={};
  q.forEach(function(k){ sentStamp[k]=stampOf(k); });

  post(payload).then(function(res){
    state.syncing=false;
    if(!res||!res.ok) throw new Error(res&&res.error||"rejected");
    write("day.dirty", read("day.dirty",[]).filter(function(k){
      return !(k in sentStamp) || stampOf(k)!==sentStamp[k];
    }));
    /* No pull here. Pushing is the common case and the server has nothing new
       to tell us; pulling on every keystroke is what made saving feel slow. */
    var t=nowParts();
    setStatus("ok","Synced "+pad(t.h)+":"+pad(t.m));
  }).catch(function(e){
    state.syncing=false;
    setStatus("warn", syncError(e)+" · saved here","Retry");
    console.warn("push failed",e);
  });
}
function pull(){
  if(!configured()) return;
  var u=cfg.url+"?action=all&token="+encodeURIComponent(cfg.token)
       +"&from="+addDays(today(),-120)+"&to="+addDays(today(),120);
  fetch(u).then(function(r){return r.json();}).then(function(res){
    if(!res||!res.ok) throw new Error(res&&res.error||"rejected");
    var dirty=read("day.dirty",[]);
    (res.days||[]).forEach(function(srv){
      if(dirty.indexOf(srv.date)>-1) return;
      var loc=days[srv.date];
      if(!loc||(srv.updated_at||"")>=(loc.updated_at||"")) days[srv.date]=srv;
    });
    if(res.lib&&dirty.indexOf("__lib__")===-1&&(res.lib.updated_at||"")>=(lib.updated_at||"")){
      lib=res.lib; lib.foods=lib.foods||[]; lib.routines=lib.routines||{}; lib.prompts=lib.prompts||[];
      write("day.lib",lib);
    }
    (res.months||[]).forEach(function(srv){
      if(!srv||!srv.month) return;
      if(dirty.indexOf("__month__:"+srv.month)>-1) return;
      var loc=months[srv.month];
      if(!loc||(srv.updated_at||"")>=(loc.updated_at||"")) months[srv.month]=srv;
    });
    saveMonths();
    saveDays(); renderSoon();
    var t=nowParts();
    setStatus("ok","Synced "+pad(t.h)+":"+pad(t.m));
  }).catch(function(e){
    setStatus("warn", syncError(e), "Retry");
    console.warn("pull failed",e);
  });
}

function collectTasks(from,to){
  var out=[];
  Object.keys(days).forEach(function(k){
    if(k<from||k>to) return;
    (days[k].tasks||[]).forEach(function(t){ normTask(t,k); out.push({ date:k, t:t }); });
  });
  return out;
}

function renderReview(){
  var n=state.revRange||7;
  Array.prototype.forEach.call($("revSeg").children,function(b){
    b.setAttribute("aria-pressed", (+b.dataset.r===n)?"true":"false");
  });

  var to=today(), from=addDays(to,-(n-1));
  var rows=collectTasks(from,to);

  var c={ontime:0,late:0,missed:0,open:0};
  rows.forEach(function(r){ c[taskOutcome(r.t)]++; });
  var settled=c.ontime+c.late+c.missed;
  var pct = settled ? Math.round(c.ontime/settled*100) : null;

  var hero=$("revHero"); hero.innerHTML=""; hero.className="hero";
  hero.appendChild(el("div","eyebrow","Last "+n+" days"));
  if(!settled&&!c.open){
    hero.appendChild(el("div","big","Nothing to review yet."));
    hero.appendChild(el("div","sub","Add tasks with an end time, then close them off as you go."));
  } else {
    hero.appendChild(el("div","big", pct===null ? "—" : pct+"% went to plan"));
    hero.appendChild(el("div","sub",
      c.ontime+" on time · "+c.late+" late · "+c.missed+" missed"+(c.open?" · "+c.open+" still open":"")));
  }

  var tiles=$("revTiles"); tiles.innerHTML="";
  [["On time",c.ontime],["Late",c.late],["Missed",c.missed],["Open",c.open]].forEach(function(o){
    var t=el("div","tile");
    t.appendChild(el("div","v",String(o[1])));
    t.appendChild(el("div","k",o[0]));
    tiles.appendChild(t);
  });

  // one bar per day, newest last
  var bars=$("revBars"); bars.innerHTML="";
  var mons=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var step = n>30 ? 7 : 1;                       // group into weeks on the long view
  var buckets=[];
  for(var i=0;i<n;i+=step){
    var s=addDays(from,i), e=addDays(from,Math.min(i+step-1,n-1));
    buckets.push({ from:s, to:e, ontime:0, late:0, missed:0 });
  }
  rows.forEach(function(r){
    var oc=taskOutcome(r.t); if(oc==="open") return;
    for(var i=0;i<buckets.length;i++){
      if(r.date>=buckets[i].from&&r.date<=buckets[i].to){ buckets[i][oc]++; break; }
    }
  });
  var max=1;
  buckets.forEach(function(b){ max=Math.max(max,b.ontime+b.late+b.missed); });

  if(!settled){
    bars.appendChild(el("p","empty","Nothing closed off in this window yet."));
    $("revBarMeta").textContent="";
  } else {
    buckets.forEach(function(b){
      var tot=b.ontime+b.late+b.missed;
      var row=el("div","barrow");
      var f=parseISO(b.from);
      var label = step===1 ? mons[f.getMonth()]+" "+f.getDate()
                           : mons[f.getMonth()]+" "+f.getDate()+"+";
      row.appendChild(el("div","bd",label));
      var w=el("div","bw");
      ["ontime","late","missed"].forEach(function(k){
        if(!b[k]) return;
        var s=el("div","bs "+k);
        s.style.width=(b[k]/max*100)+"%";
        s.title=b[k]+" "+OUTCOME_LABEL[k].toLowerCase();
        w.appendChild(s);
      });
      row.appendChild(w);
      row.appendChild(el("div","bn",tot?String(tot):""));
      bars.appendChild(row);
    });
    $("revBarMeta").textContent = step===1 ? "per day" : "per week";
  }

  // what slipped
  var miss=$("revMiss"); miss.innerHTML="";
  var bad=rows.filter(function(r){ var o=taskOutcome(r.t); return o==="missed"||o==="late"; })
              .sort(function(a,b){ return b.date.localeCompare(a.date); });
  $("revMissMeta").textContent = bad.length?String(bad.length):"";
  if(!bad.length){
    miss.appendChild(el("li","empty", settled?"Nothing missed. Good window.":"Nothing yet."));
  } else {
    bad.slice(0,25).forEach(function(r){
      var d=parseISO(r.date), li=el("li");
      li.style.cursor="pointer";
      li.appendChild(el("span","when",mons[d.getMonth()]+" "+d.getDate()));
      var what=el("div","what");
      what.appendChild(el("div",null,r.t.title));
      var oc=taskOutcome(r.t);
      what.appendChild(el("span","badge "+oc,OUTCOME_LABEL[oc]));
      if(r.t.remarks) what.appendChild(el("div","rmk",r.t.remarks));
      li.appendChild(what);
      li.addEventListener("click",function(){ state.date=r.date; setView("today"); });
      miss.appendChild(li);
    });
  }
}

      .forEach(p => { const old = localStorage.getItem(p[0]); if(old !== null && localStorage.getItem(p[1]) === null) localStorage.setItem(p[1], old); });

/* ---------- small helpers ---------- */
const $ = id => document.getElementById(id);

/* ---------- dates (ISO yyyy-mm-dd strings, local) ---------- */
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function parseISO(s){ const p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }

function weekStart(s){ const d = parseISO(s); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return iso(d); }
function fmtD(s){ if(!s) return "—"; const d = parseISO(s); return MON[d.getMonth()] + " " + d.getDate(); }
function fmtDY(s){ if(!s) return "—"; const d = parseISO(s); return MON[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(); }
function fmtRange(a, b){ if(!a && !b) return "No dates"; if(a === b) return fmtD(a); return fmtD(a) + " – " + fmtD(b); }
function fmtAgo(ts){
  if(!ts) return "";
  const s = (Date.now() - new Date(ts).getTime()) / 1000;
  if(s < 60) return "just now";
  if(s < 3600) return Math.floor(s / 60) + "m ago";
  if(s < 86400) return Math.floor(s / 3600) + "h ago";

}
function dueLabel(due, done){

  const T = todayISO(), n = diffDays(T, due);
  if(done) return { text:fmtD(due), late:false };
  if(n < 0) return { text:(-n) + "d overdue", late:true };
  if(n === 0) return { text:"Today", late:false };

}
function fmtMins(m){ m = Math.round(m || 0); const h = Math.floor(m / 60), r = m % 60; return h + ":" + pad(r); }
function parseHours(v){
  v = String(v || "").trim(); if(!v) return 0;
  if(v.indexOf(":") > -1){ const p = v.split(":"); return (+p[0] || 0) * 60 + (+p[1] || 0); }
  const n = parseFloat(v.replace(",", ".")); return isFinite(n) ? Math.round(n * 60) : 0;

/* ---------- store ----------
   Every collection is a flat array of records with an id and updated_at.
   Each collection becomes one Google Sheet tab in Phase 2; each field one
   column. Deletes are tombstones (deleted:true) so a sync can carry them. */
const COLLS = ["accounts","users","projects","phases","tasks","deps","approvals","messages","files","updates",
               "templates","time_entries","activity","notifications","decisions","agent_runs","sources"];
const PREFIX = { accounts:"ac", users:"u", projects:"p", phases:"ph", tasks:"t", deps:"dp", approvals:"ap", messages:"m",
                 files:"f", updates:"up", templates:"tp", time_entries:"te", activity:"av", notifications:"n",
                 decisions:"dc", agent_runs:"ar", sources:"sr" };
let db = null;

function blankDb(){ const o = { meta:{ version:1, created_at:nowISO() } }; COLLS.forEach(c => o[c] = []); return o; }
function loadDb(){ const d = read(LS_DB, null); if(!d) return null; COLLS.forEach(c => d[c] = d[c] || []); return d; }
function saveDb(){ write(LS_DB, db); }
function rows(c, f){ return db[c].filter(r => !r.deleted && (!f || f(r))); }
function byId(c, id){ if(!id) return null; for(const r of db[c]) if(r.id === id) return r.deleted ? null : r; return null; }
function insert(c, rec){
  rec.id = rec.id || uid(PREFIX[c]);
  rec.created_at = rec.created_at || nowISO();
  rec.updated_at = nowISO();
  db[c].push(rec); markDirty(c, rec.id); return rec;
}
function update(c, id, patch){
  const r = byId(c, id); if(!r) return null;
  let changed = false;
  for(const k in patch){ if(JSON.stringify(r[k]) !== JSON.stringify(patch[k])){ r[k] = patch[k]; changed = true; } }
  if(changed){ r.updated_at = nowISO(); markDirty(c, id); }
  return r;
}
function remove(c, id){
  const r = db[c].find(x => x.id === id);
  if(r && !r.deleted){ r.deleted = true; r.updated_at = nowISO(); markDirty(c, id); }
}
/* Every mutation path ends here: persist, then redraw what's on screen. */
function commit(){ saveDb(); if(typeof scheduleRender === "function") scheduleRender(); }

/* ---------- sync (Phase 2) ----------
   Day's pattern, generalised from date keys to "collection:id" keys.
   Off until an Apps Script /exec URL and secret are saved in Settings. */
let cfg = Object.assign({ url:"", token:"", lastPull:"" }, read(LS_CFG, {}));
let syncTimer = null, syncing = false, syncState = { kind:"", text:"Saved on this device" };
function saveCfg(){ write(LS_CFG, cfg); }
function syncConfigured(){ return !!(cfg.url && cfg.token); }
function markDirty(c, id){
  const q = read(LS_DIRTY, []), k = c + ":" + id;
  if(q.indexOf(k) === -1){ q.push(k); write(LS_DIRTY, q); }
  queueSync();
}
function queueSync(){
  if(!syncConfigured()) return;
  syncState = { kind:"warn", text:"Saved here · syncing…" };
  clearTimeout(syncTimer); syncTimer = setTimeout(sync, 1500);
}
function stampOf(k){ const i = k.indexOf(":"), r = db[k.slice(0, i)] && db[k.slice(0, i)].find(x => x.id === k.slice(i + 1)); return r ? r.updated_at || "" : ""; }

  if(!syncConfigured() || syncing) return;

  const q = read(LS_DIRTY, []);
  if(!q.length){ pull(); return; }
  syncing = true;
  const payload = { token:cfg.token, action:"save", rows:{} }, sent = {};
  q.forEach(k => {
    const i = k.indexOf(":"), c = k.slice(0, i), id = k.slice(i + 1);
    const r = db[c] && db[c].find(x => x.id === id); if(!r) return;
    (payload.rows[c] = payload.rows[c] || []).push(r); sent[k] = r.updated_at || "";
  });
  fetch(cfg.url, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify(payload) })
    .then(r => r.json())
    .then(res => {
      syncing = false;
      if(!res || !res.ok) throw new Error(res && res.error || "rejected");
      /* Anything edited while the request was in flight stays dirty. */
      write(LS_DIRTY, read(LS_DIRTY, []).filter(k => !(k in sent) || stampOf(k) !== sent[k]));
      syncState = { kind:"ok", text:"Synced " + new Date().toTimeString().slice(0, 5) };

    })

    if(!res || !res.ok) throw new Error(res && res.error || "rejected");

      if(!db[c]) return;
      res.rows[c].forEach(srv => {

    syncState = { kind:"ok", text:"Synced " + new Date().toTimeString().slice(0, 5) };

  }).catch(e => { syncState = { kind:"warn", text:syncError(e, "Couldn't reach the sheet") }; console.warn("pull failed", e);
    if(typeof renderChrome === "function") renderChrome(); });
}
/* Plain-English sync errors (the same mapping Day uses). */
function syncError(e, fallback){
  const m = String(e && e.message || e || "");
  if(/bad token/i.test(m)) return "Secret doesn't match";
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Can't reach that URL";
  if(/JSON|Unexpected token/i.test(m)) return "URL isn't the /exec one";
  if(/busy/i.test(m)) return "Sheet busy · retrying";

}
/* Connecting a device to the Sheet makes the Sheet the truth: this browser's
   data (often the demo) is cleared and everything is pulled fresh. */
function connectSheet(url, token){
  cfg.url = url; cfg.token = token; cfg.lastPull = ""; saveCfg();
  db = blankDb(); db.meta.seeded = true; db.meta.connected = nowISO();
  /* a stand-in for you until the pull lands, so screens can draw; the Sheet's copy replaces it */
  db.users.push({ id:"u-anand", name:"Anand Viswanathan", type:"TEAM", role:"Solution Architect", account_id:"ac-us",
                  email:"", capacity_min:2400, status:"ACTIVE", created_at:"1970-01-01T00:00:00.000Z", updated_at:"1970-01-01T00:00:00.000Z" });

/* ---------- session ---------- */
let session = Object.assign({ user:"", portalAs:{} }, read(LS_SESSION, {}));
function saveSession(){ write(LS_SESSION, session); }
/* In the customer portal, "me" is the customer being previewed, so every
   action taken there is recorded against them, not the team member. */
let actor = null;
function me(){ return actor || byId("users", session.user) || rows("users", u => u.type === "TEAM")[0]; }

/* ---------- people ---------- */
const AV_COLORS = ["#2E8F6C","#3D63B0","#7457A6","#A8700F","#B4483F","#2F7F8F","#8A5A9E","#5C7A2E"];
function hashColor(s){ let h = 0; for(const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) | 0; return AV_COLORS[Math.abs(h) % AV_COLORS.length]; }
function initials(n){ return String(n || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join(""); }
function userName(id){ const u = byId("users", id); return u ? u.name : "Someone"; }
function firstName(id){ return userName(id).split(" ")[0]; }
function isCustomer(u){ return u && u.type === "CUSTOMER"; }
function projectPeople(p){ return uniq([p.owner_id].concat(p.team_ids || [], p.customer_ids || [])).map(id => byId("users", id)).filter(Boolean); }

/* ---------- visibility: the one rule every screen uses ----------
   Team members see everything. A customer sees only their own projects, and
   never anything private — a private phase hides every task in it. */
function visibleTo(user, coll, rec){
  if(!user || user.type !== "CUSTOMER") return true;
  if(!rec) return false;
  const pid = coll === "projects" ? rec.id : rec.project_id || (rec.task_id && (byId("tasks", rec.task_id) || {}).project_id);
  const p = byId("projects", pid);
  if(!p || (p.customer_ids || []).indexOf(user.id) === -1) return false;
  if(coll === "projects") return true;
  if(rec.private) return false;
  if(coll === "tasks"){
    const ph = byId("phases", rec.phase_id); if(ph && ph.private) return false;
    if(rec.parent_id){ const par = byId("tasks", rec.parent_id); if(par && !visibleTo(user, "tasks", par)) return false; }
  }
  if(coll === "messages" && rec.thread === "private") return false;
  if(coll === "approvals"){ const t = byId("tasks", rec.task_id); return !!t && visibleTo(user, "tasks", t); }
  return true;
}

/* ---------- activity + notifications ---------- */
function logAct(pid, taskId, text, who){
  insert("activity", { project_id:pid, task_id:taskId || "", user_id:(who || me()).id, text, at:nowISO() });
}
function notify(userId, text, link){
  if(!userId || (me() && userId === me().id)) return;
  insert("notifications", { user_id:userId, text, link:link || "", read:false, at:nowISO() });
}

/* ---------- tasks & plan rules ---------- */
const TASK_STATUSES = ["To do","In progress","Blocked","Completed"];
const PROJECT_STATUSES = ["Proposed","In progress","On hold","Blocked","Completed"];
function statusKind(s){ return { "To do":"todo", "In progress":"prog", "Completed":"done", "Blocked":"blocked", "On hold":"hold", "Proposed":"prop" }[s] || "todo"; }
function projTasks(pid, f){ return rows("tasks", t => t.project_id === pid && !t.parent_id && (!f || f(t))); }
function subtasks(tid){ return rows("tasks", t => t.parent_id === tid).sort(by(t => t.created_at)); }
function phaseTasks(phid){ return rows("tasks", t => t.phase_id === phid && !t.parent_id).sort(by(t => (t.start || "9") + (t.type === "MILESTONE" ? "1" : "0") + t.name)); }
function projPhases(pid){ return rows("phases", p => p.project_id === pid).sort(by(p => (p.start || "9999") + pad(p.order || 0))); }
function isOverdue(t){ return t.status !== "Completed" && t.due && t.due < todayISO(); }

function setTaskStatus(t, st){
  const prev = t.status; if(prev === st) return;
  const T = todayISO(), patch = { status:st };
  /* Actual dates are stamped when the change is written; they can't be backdated. */
  if(st === "In progress" && !t.start_actual) patch.start_actual = T;
  if(st === "Completed"){ patch.due_actual = T; if(!t.start_actual) patch.start_actual = T; }
  if(prev === "Completed" && st !== "Completed") patch.due_actual = "";
  update("tasks", t.id, patch);
  logAct(t.project_id, t.id, "moved “" + t.name + "” from " + prev + " to " + st);
  if(st === "Completed" || prev === "Completed") (t.follower_ids || []).concat(t.assignee_ids || []).forEach(u =>
    notify(u, firstName(me().id) + " marked “" + t.name + "” " + st.toLowerCase(), "#/projects/" + t.project_id + "/plan?t=" + t.id));
  recalcPhase(t.phase_id);
}
function setTaskDates(t, start, due){
  if(t.type === "MILESTONE"){ start = due || start; due = start; }
  if(start && due && due < start) due = start;
  update("tasks", t.id, { start:start || "", due:due || "" });
  const moved = cascadeFrom(t.id);
  recalcPhase(t.phase_id);
  return moved;
}
/* A dependent task starts the day after its latest blocker ends and keeps its
   duration. Only linked tasks move; work with no link is never touched. Dates
   only ever move later — removing a blocker leaves them where they landed. */
function applyDeps(taskId, moved, seen){
  seen = seen || {}; moved = moved || [];
  if(seen[taskId]) return moved; seen[taskId] = 1;
  const t = byId("tasks", taskId); if(!t) return moved;
  let latest = "";
  rows("deps", d => d.task_id === taskId).forEach(d => { const b = byId("tasks", d.blocked_by_id); if(b) latest = maxD(latest, b.due); });
  if(latest && t.start && t.start <= latest){
    const dur = t.due ? diffDays(t.start, t.due) : 0, ns = addDays(latest, 1);
    update("tasks", t.id, { start:ns, due:addDays(ns, dur) });
    moved.push(t); recalcPhase(t.phase_id);
  }
  rows("deps", d => d.blocked_by_id === taskId).forEach(d => applyDeps(d.task_id, moved, seen));
  return moved;
}

  const moved = [];
  rows("deps", d => d.blocked_by_id === taskId).forEach(d => applyDeps(d.task_id, moved));
  return moved;
}
function wouldCycle(taskId, blockerId){
  if(taskId === blockerId) return true;
  const stack = [blockerId], seen = {};
  while(stack.length){
    const x = stack.pop(); if(x === taskId) return true; if(seen[x]) continue; seen[x] = 1;
    rows("deps", d => d.task_id === x).forEach(d => stack.push(d.blocked_by_id));
  }

}
function addDep(taskId, blockerId){
  if(wouldCycle(taskId, blockerId)) return { error:"That would make a loop — the blocker already waits on this task." };
  if(rows("deps", d => d.task_id === taskId && d.blocked_by_id === blockerId).length) return { error:"Already linked." };
  insert("deps", { task_id:taskId, blocked_by_id:blockerId, project_id:(byId("tasks", taskId) || {}).project_id });
  const t = byId("tasks", taskId), b = byId("tasks", blockerId);
  logAct(t.project_id, t.id, "made “" + t.name + "” wait on “" + b.name + "”");
  return { moved:applyDeps(taskId) };
}
/* A phase stretches to contain its tasks; its status follows them. */
function recalcPhase(phid){
  const ph = byId("phases", phid); if(!ph) return;
  const ts = phaseTasks(phid); if(!ts.length) return;
  let s = "", e = "";
  ts.forEach(t => { s = minD(s, t.start || t.due); e = maxD(e, t.due || t.start); });
  const done = ts.filter(t => t.status === "Completed").length;
  const st = done === ts.length ? "Completed" : ts.some(t => t.status !== "To do") ? "In progress" : "To do";
  update("phases", phid, { start:s, due:e, status:st });
}
function recalcProject(pid){
  projPhases(pid).forEach(ph => recalcPhase(ph.id));
  let s = "", e = "";
  projPhases(pid).forEach(ph => { s = minD(s, ph.start); e = maxD(e, ph.due); });
  const p = byId("projects", pid);
  if(p && s) update("projects", pid, { start:minD(p.start, s), due:maxD(p.due, e) });
}

function health(pid){
  const ts = projTasks(pid), T = todayISO(), p = byId("projects", pid);
  const done = ts.filter(t => t.status === "Completed");
  const overdue = ts.filter(isOverdue);
  const atRisk = ts.filter(t => t.at_risk && t.status !== "Completed");
  const blocked = ts.filter(t => t.status === "Blocked");
  const tids = {}; ts.forEach(t => tids[t.id] = 1);
  const pending = rows("approvals", a => a.status === "REQUESTED" && tids[a.task_id]);
  const pct = ts.length ? Math.round(done.length / ts.length * 100) : 0;
  let inferred = "No tasks";
  if(ts.length){
    if(p && p.status === "Completed") inferred = "Completed";
    else if(overdue.length) inferred = "Running late";
    else {
      const span = p && p.start && p.due ? Math.max(1, diffDays(p.start, p.due)) : 0;
      const exp = span ? Math.max(0, Math.min(100, diffDays(p.start, T) / span * 100)) : 0;
      inferred = pct > exp + 10 ? "Ahead of time" : "On track";
    }
  }
  return { tasks:ts, done, overdue, atRisk, blocked, pending, pct, inferred,
           milestones:ts.filter(t => t.type === "MILESTONE").sort(by(t => t.due || "")) };
}

/* ---------- templates ----------
   Saving a project as a template turns dates into day offsets from the
   project start and people into roles. Creating from one does the reverse. */
function roleOf(uid){ const u = byId("users", uid); return !u ? "" : u.type === "CUSTOMER" ? "Customer" : (u.role || "Team member"); }
function saveAsTemplate(pid, name){
  const p = byId("projects", pid), base = p.start || todayISO();
  const keyOf = {};
  const phases = projPhases(pid).map((ph, i) => ({
    key:"ph" + i, name:ph.name, private:!!ph.private,
    tasks:phaseTasks(ph.id).map((t, j) => {
      const k = "k" + i + "_" + j; keyOf[t.id] = k;
      return { key:k, name:t.name, type:t.type, private:!!t.private, description:t.description || "",
               start_offset:t.start ? diffDays(base, t.start) : 0, duration:t.start && t.due ? diffDays(t.start, t.due) : 0,
               effort_h:Math.round((t.effort_min || 0) / 60), role:roleOf((t.assignee_ids || [])[0]) };
    })
  }));
  const deps = rows("deps", d => d.project_id === pid && keyOf[d.task_id] && keyOf[d.blocked_by_id]).map(d => [keyOf[d.task_id], keyOf[d.blocked_by_id]]);
  return insert("templates", { name:name || p.name + " template", category:"Project", description:"Saved from " + p.name, phases, deps, source_project_id:pid });
}
function templateRoles(tpl){ return uniq(tpl.phases.flatMap(ph => ph.tasks.map(t => t.role)).filter(Boolean)); }
function templateSpan(tpl){ let e = 0; tpl.phases.forEach(ph => ph.tasks.forEach(t => e = Math.max(e, (t.start_offset || 0) + (t.duration || 0)))); return e; }
function instantiateTemplate(tpl, pid, start, roleMap, namePrefix){
  const keyToId = {};
  const order0 = projPhases(pid).length;
  tpl.phases.forEach((tph, i) => {
    const ph = insert("phases", { project_id:pid, name:(namePrefix || "") + tph.name, order:order0 + i, private:!!tph.private, status:"To do", start:"", due:"" });
    tph.tasks.forEach(tt => {
      const s = addDays(start, tt.start_offset || 0), who = roleMap[tt.role];
      const t = insert("tasks", { project_id:pid, phase_id:ph.id, parent_id:"", name:tt.name, description:tt.description || "",
        type:tt.type || "TASK", status:"To do", priority:"", at_risk:false, start:s, due:addDays(s, tt.duration || 0),
        start_actual:"", due_actual:"", assignee_ids:who ? [who] : [], follower_ids:[], effort_min:(tt.effort_h || 0) * 60,
        private:!!tt.private, csat_enabled:false });
      keyToId[tt.key] = t.id;
    });
  });
  (tpl.deps || []).forEach(d => { if(keyToId[d[0]] && keyToId[d[1]]) insert("deps", { task_id:keyToId[d[0]], blocked_by_id:keyToId[d[1]], project_id:pid }); });
  Object.values(keyToId).forEach(id => applyDeps(id));
  recalcProject(pid);
  return Object.keys(keyToId).length;
}

/* ---------- time ---------- */
function myEntries(uid, from, to){ return rows("time_entries", e => e.user_id === uid && e.date >= from && e.date <= to); }
function logTime(taskId, date, minutes, notes, billable){
  const t = byId("tasks", taskId); if(!t || !minutes) return null;
  const ex = rows("time_entries", e => e.user_id === me().id && e.task_id === taskId && e.date === date && e.status === "NOT_SUBMITTED")[0];
  if(ex){ update("time_entries", ex.id, { minutes:(ex.minutes || 0) + minutes, notes:[ex.notes, notes].filter(Boolean).join(" · ") }); return ex; }
  return insert("time_entries", { user_id:me().id, date, minutes, project_id:t.project_id, task_id:taskId, billable:billable !== false,
                                  notes:notes || "", status:"NOT_SUBMITTED" });
}

function h(tag, a){

  if(a) for(const k in a){
    const v = a[k];

    if(k === "class") e.className = v;
    else if(k === "style") { if(typeof v === "object") Object.assign(e.style, v); else e.style.cssText = v; }

  return e;
}

}

/* ---------- render loop ----------

let renderQueued = false, renderHeld = false, lastPath = null;

  const a = document.activeElement; if(!a) return false;

  return a.tagName === "INPUT" && /^(text|search|number|email|url|)$/.test(a.type || "");
}

  if(renderHeld) return; renderHeld = true;

  r = r || parseRoute();
  const top = r.parts[0];
  const rl = $("ln-raillinks"); rl.innerHTML = "";
  RAIL.forEach(x => rl.appendChild(h("a", { class:"rl-a", href:"#/" + x[0], "aria-current":top === x[0] ? "page" : null }, icon(x[2]), x[1])));
  const rs = $("ln-railsettings"); rs.innerHTML = ""; add(rs, [icon("gear"), "Settings"]);
  if(top === "settings") rs.setAttribute("aria-current", "page"); else rs.removeAttribute("aria-current");

  const c = $("ln-crumbs"); c.innerHTML = "";
  const cr = crumbs.length ? crumbs : [[(RAIL.find(x => x[0] === top) || [0, "Settings"])[1]]];
  cr.forEach((x, i) => {
    if(i) c.appendChild(h("span", { class:"sep" }, "/"));
    c.appendChild(i === cr.length - 1 || !x[1] ? h("span", { class:"cur" }, x[0]) : h("a", { href:x[1] }, x[0]));
  });
  const si = $("ln-searchic"); if(!si.firstChild) si.appendChild(icon("search", "sm"));

  const va = $("ln-viewas"); va.innerHTML = ""; add(va, [icon("eye", "sm"), "View as customer"]);
  const bell = $("ln-bell"); bell.innerHTML = ""; bell.appendChild(icon("bell"));
  const unread = rows("notifications", n => n.user_id === me().id && !n.read).length;
  if(unread) bell.appendChild(h("span", { class:"badge-n" }, unread));
  const mb = $("ln-me"); mb.innerHTML = ""; mb.appendChild(avatar(me(), "lg"));
}

function runSearch(inp){
  const q = inp.value.trim().toLowerCase(); if(q.length < 2){ closePop(); return; }
  const hit = s => String(s || "").toLowerCase().indexOf(q) > -1;
  const ps = rows("projects", p => hit(p.name) || hit((byId("accounts", p.account_id) || {}).name)).slice(0, 5);
  const as = rows("accounts", a => a.kind !== "vendor" && hit(a.name)).slice(0, 4);
  const ts = rows("tasks", t => hit(t.name)).slice(0, 8);
  const res = [];
  if(ps.length) res.push(h("div", { class:"pop-h" }, "Projects"), ps.map(p => h("button", { class:"pop-i", onclick:() => { closePop(); inp.value = ""; go("projects/" + p.id + "/overview"); } }, icon("projects", "sm"), h("div", { class:"grow" }, p.name, h("small", null, (byId("accounts", p.account_id) || {}).name)))));
  if(as.length) res.push(h("div", { class:"pop-h" }, "Accounts"), as.map(a => h("button", { class:"pop-i", onclick:() => { closePop(); inp.value = ""; go("accounts/" + a.id); } }, icon("building", "sm"), h("div", { class:"grow" }, a.name))));
  if(ts.length) res.push(h("div", { class:"pop-h" }, "Tasks"), ts.map(t => h("button", { class:"pop-i", onclick:() => { closePop(); inp.value = ""; go("projects/" + t.project_id + "/plan", { t:t.id }); } }, icon("tasks", "sm"),
    h("div", { class:"grow" }, t.name, h("small", null, (byId("projects", t.project_id) || {}).name + " · " + t.status)))));
  openPop(inp, res.length ? res : empty("No matches for “" + inp.value + "”"));
}
document.addEventListener("keydown", e => {

/* Per-viewer conveniences only (remembered toggles). Never data. */
let ui = Object.assign({ planMode:"board", who:"all", showDone:true, zoom:"week", q:"" }, read("orbit.ui", {}));

function viewProject(r){
  const p = byId("projects", r.parts[1]);
  if(!p) return h("div", { class:"page" }, empty("That project doesn't exist any more."));
  const tab = r.parts[2] || "overview", a = byId("accounts", p.account_id) || {};
  crumbs = [["Projects", "#/projects"], [a.name, "#/accounts/" + a.id], [p.name]];
  const body = ({ overview:tabOverview, plan:tabPlan, list:tabList, chat:tabChat, files:tabFiles, updates:tabUpdates, settings:tabSettings }[tab] || tabOverview)(p, r);
  return h("div", { class:"page" + (tab === "plan" ? " wide" : "") }, projectHeader(p, tab), body);
}

/* ---------------- overview ---------------- */
function tabOverview(p){
  const hl = health(p.id), T = todayISO(), L = "#/projects/" + p.id + "/list?f=";
  const tiles = h("div", { class:"tiles" },
    tile(hl.pct + "%", hl.done.length + " / " + hl.tasks.length + " tasks done", "good"),
    tile(hl.overdue.length, "Overdue", hl.overdue.length ? "bad" : "", () => location.hash = L + "overdue"),
    tile(hl.atRisk.length, "At risk", hl.atRisk.length ? "warn" : "", () => location.hash = L + "atrisk"),
    tile(hl.blocked.length, "Blocked", hl.blocked.length ? "bad" : "", () => location.hash = L + "blocked"),
    tile(hl.pending.length, "Approvals pending", hl.pending.length ? "warn" : ""),
    tile(Math.max(0, diffDays(T, p.due || T)), "Days to due date"));

  const phs = projPhases(p.id), s0 = p.start, span = Math.max(1, diffDays(p.start, p.due));
  const pos = d => Math.max(0, Math.min(100, diffDays(s0, d) / span * 100));
  const phaseBars = h("div", { class:"phase-bars" }, phs.map(ph => {
    const ts = phaseTasks(ph.id), dn = ts.filter(t => t.status === "Completed").length, pc = ts.length ? Math.round(dn / ts.length * 100) : 0;
    const l = pos(ph.start), w = Math.max(1.5, pos(ph.due) - l);
    return h("div", { class:"pb" },
      h("div", { class:"nm", title:ph.name }, ph.private ? icon("lock", "xs") : null, " ", ph.name),
      h("div", { class:"track", title:fmtRange(ph.start, ph.due) },
        h("i", { style:{ left:l + "%", width:w + "%" } }, h("b", { style:{ width:pc + "%" } })),
        T >= s0 && T <= p.due ? h("span", { class:"now", style:{ left:pos(T) + "%" } }) : null),
      h("div", { class:"pct" }, pc + "%"));
  }));

  const attention = [].concat(
    hl.overdue.map(t => [t, h("span", { class:"chip red" }, dueLabel(t.due).text)]),
    hl.blocked.filter(t => !isOverdue(t)).map(t => [t, h("span", { class:"chip red" }, "Blocked")]),
    hl.atRisk.filter(t => !isOverdue(t) && t.status !== "Blocked").map(t => [t, h("span", { class:"chip gold" }, "At risk")]));
  const attnList = attention.length ? h("ul", { class:"tl" }, attention.map(x => taskLine(x[0], x[1]))) : empty("Nothing overdue, blocked or at risk.");

  const ms = h("ul", { class:"tl" }, hl.milestones.map(m => {
    let tag;
    if(m.status === "Completed"){ const d = m.due_actual ? diffDays(m.due, m.due_actual) : 0; tag = h("span", { class:"chip " + (d > 0 ? "gold" : "jade") }, d > 0 ? "Done " + d + "d late" : "Done"); }
    else if(m.due < T) tag = h("span", { class:"chip red" }, "Delayed by " + plural(diffDays(m.due, T), "day"));
    else tag = h("span", { class:"chip" }, "in " + plural(diffDays(T, m.due), "day"));
    return h("li", { class:"click", onclick:() => openTask(m.id) }, h("span", { style:"color:var(--violet)" }, icon("diamond", "sm")),
      h("div", { class:"grow" }, h("div", { class:"nm" }, m.name), h("div", { class:"ctx" }, "Planned " + fmtDY(m.due) + (m.due_actual ? " · actual " + fmtDY(m.due_actual) : ""))), tag);
  }));

  const ups = rows("updates", u => u.project_id === p.id).sort(by(u => u.at)).reverse().slice(0, 3);
  const team = projectPeople(p);
  const fee = (p.fields || {}).fee, arr = (p.fields || {}).arr;
  const portal = h("div", null,
    h("p", { class:"sub", style:"margin-bottom:10px" }, plural((p.customer_ids || []).length, "customer contact") + " invited. They see the plan, files and updates you share — nothing marked private."),
    h("button", { class:"btn sm", onclick:() => go("portal/" + p.id + "/home") }, icon("external", "sm"), "Open their portal"));

  return [tiles, h("div", { class:"grid g-main" },
    h("div", { class:"grid" },
      card("Phases", plural(phs.length, "phase"), phaseBars),
      card("Needs attention", attention.length || "", attnList, { icon:"alert" }),
      card("Milestones", plural(hl.milestones.length, "milestone"), hl.milestones.length ? ms : empty("No milestones yet.")),
      card("Latest updates", "", ups.length ? ups.map(updateItem) : empty("No updates posted."), { action:h("a", { class:"link", href:"#/projects/" + p.id + "/updates" }, "All updates") })),
    h("div", { class:"grid", style:"align-content:start" },
      card("Project info", null, h("div", { class:"kv" },
        h("span", { class:"k" }, "Owner"), h("span", null, userName(p.owner_id)),
        h("span", { class:"k" }, "Status"), h("span", null, statusPill(p.status)),
        h("span", { class:"k" }, "Start"), h("span", null, fmtDY(p.start)),
        h("span", { class:"k" }, "Due"), h("span", null, fmtDY(p.due)),
        h("span", { class:"k" }, "Project fee"), h("span", null, fee ? "$" + Number(fee).toLocaleString() : "—"),
        h("span", { class:"k" }, "ARR"), h("span", null, arr ? "$" + Number(arr).toLocaleString() : "—"),
        h("span", { class:"k" }, "Budget"), h("span", null, ((p.fields || {}).budget_hours || "—") + " h · " + ((p.fields || {}).billing || "")),
        h("span", { class:"k" }, "Logged"), h("span", null, fmtMins(rows("time_entries", e => e.project_id === p.id).reduce((s, e) => s + (e.minutes || 0), 0)) + " h")),
        { internal:true, only:"Only your team" }),
      card("Customer portal", null, portal),
      card("Team", plural(team.length, "person", "people"), h("div", { class:"grid", style:"gap:10px" },
        h("div", { class:"lab" }, "Our team"), team.filter(u => !isCustomer(u)).map(u => whoRow(u, u.role + (u.id === p.owner_id ? " · owner" : ""))),
        h("div", { class:"lab", style:"margin-top:6px" }, "Customer team"), team.filter(isCustomer).map(u => whoRow(u)),
        h("button", { class:"btn sm", style:"justify-self:start", onclick:() => inviteModal(p) }, icon("plus", "sm"), "Invite customer contact"))))) ];
}
function taskLine(t, right){
  const p = byId("projects", t.project_id), dl = dueLabel(t.due, t.status === "Completed");
  return h("li", { class:"click", onclick:() => openTask(t.id) }, statusCircle(t),
    h("div", { class:"grow" }, h("div", { class:"nm" }, t.name), h("div", { class:"ctx" }, (p ? p.name + " · " : "") + ((byId("phases", t.phase_id) || {}).name || ""))),
    avatars(t.assignee_ids), right || h("span", { class:"when" + (dl.late ? " late" : "") }, dl.text));
}

/* ---------------- plan: filters ---------------- */
function planFilter(p){
  const mine = me().id;
  return t => {
    if(!ui.showDone && t.status === "Completed") return false;
    if(ui.q && t.name.toLowerCase().indexOf(ui.q.toLowerCase()) === -1) return false;
    const as = t.assignee_ids || [];
    if(ui.who === "mine" && as.indexOf(mine) === -1) return false;
    if(ui.who === "team" && !as.some(id => !isCustomer(byId("users", id)))) return false;
    if(ui.who === "customer" && !as.some(id => isCustomer(byId("users", id)))) return false;
    return true;
  };
}
function planBar(p){
  return h("div", { class:"planbar" },
    segm([["board","Board","board"],["gantt","Gantt","gantt"]], ui.planMode, v => setUi({ planMode:v })),
    segm([["all","All"],["team","Our team"],["customer","Customer"],["mine","Mine"]], ui.who, v => setUi({ who:v })),
    h("input", { class:"inp", style:"width:200px", placeholder:"Filter tasks", value:ui.q, oninput:e => { ui.q = e.target.value; write("orbit.ui", ui); scheduleRender(); } }),
    h("label", { class:"chk-l" }, h("input", { type:"checkbox", checked:ui.showDone, onchange:e => setUi({ showDone:e.target.checked }) }), "Show completed"),
    h("span", { class:"grow" }),
    ui.planMode === "gantt" ? segm([["day","Days"],["week","Weeks"],["month","Months"]], ui.zoom, v => setUi({ zoom:v })) : null,
    h("button", { class:"btn", onclick:() => addPhaseModal(p) }, icon("plus", "sm"), "Phase"));
}
function tabPlan(p){ return [planBar(p), ui.planMode === "gantt" ? gantt(p) : board(p)]; }

/* ---------------- plan: board ---------------- */
let dragTask = null;
function board(p){
  const f = planFilter(p), T = todayISO();
  const cols = projPhases(p.id).map(ph => {
    const all = phaseTasks(ph.id), ts = all.filter(f), dn = all.filter(t => t.status === "Completed").length;
    const pc = all.length ? Math.round(dn / all.length * 100) : 0, complete = all.length && dn === all.length;
    const col = h("div", { class:"col" + (ph.private ? " priv" : ""),
      ondragover:e => { if(!dragTask) return; e.preventDefault(); col.classList.add("drop"); },
      ondragleave:() => col.classList.remove("drop"),
      ondrop:e => { e.preventDefault(); col.classList.remove("drop"); if(!dragTask) return;
        const t = byId("tasks", dragTask), from = t.phase_id; dragTask = null;
        if(from === ph.id) return;
        update("tasks", t.id, { phase_id:ph.id }); subtasks(t.id).forEach(s => update("tasks", s.id, { phase_id:ph.id }));
        recalcPhase(from); recalcPhase(ph.id); logAct(p.id, t.id, "moved “" + t.name + "” to " + ph.name); commit(); } },
      h("div", { class:"col-h" },
        h("div", { class:"t" }, complete ? h("span", { class:"col-done", title:"Phase complete" }, icon("check", "xs")) : null,
          h("b", null, ph.name), ph.private ? h("span", { class:"only", title:"Hidden from the customer" }, icon("lock", "xs"), "Private") : null,
          h("button", { class:"iconbtn", style:"width:26px;height:26px", title:"Phase options", onclick:e => phaseMenu(e.currentTarget, ph) }, icon("dots", "sm"))),
        h("div", { class:"dates" }, h("span", null, fmtRange(ph.start, ph.due)), h("span", null, dn + "/" + all.length),
          ph.due && ph.due < T && !complete ? h("span", { class:"red" }, "overrun") : null),
        bar(pc)),
      h("div", { class:"col-b", "data-sk":"col-" + ph.id }, ts.length ? ts.map(t => taskCard(t)) : h("div", { class:"empty", style:"padding:10px" }, all.length ? "Filtered out" : "No tasks yet")),
      h("div", { class:"col-add" }, h("input", { placeholder:"+ Add a task", onkeydown:e => {
        if(e.key !== "Enter" || !e.target.value.trim()) return;
        const s = ph.start && ph.start > T ? ph.start : T;
        const t = insert("tasks", { project_id:p.id, phase_id:ph.id, parent_id:"", name:e.target.value.trim(), description:"", type:"TASK", status:"To do", priority:"",
          at_risk:false, start:s, due:s, start_actual:"", due_actual:"", assignee_ids:[me().id], follower_ids:[], effort_min:0, private:!!ph.private, csat_enabled:false });
        logAct(p.id, t.id, "added “" + t.name + "”"); recalcPhase(ph.id);
        e.target.value = ""; saveDb(); render(); const again = document.querySelector('[data-sk="col-' + ph.id + '"]'); if(again) again.scrollTop = 1e6;
        const inp = again && again.parentNode.querySelector(".col-add input"); if(inp) inp.focus();
      } })));
    return col;
  });
  return h("div", { class:"board", "data-sk":"board" }, cols,
    h("div", { class:"col", style:"background:transparent;border-style:dashed;flex-basis:240px" },
      h("button", { class:"btn ghost", style:"margin:12px", onclick:() => addPhaseModal(p) }, icon("plus", "sm"), "Add phase")));
}
function taskCard(t){
  const done = t.status === "Completed", dl = dueLabel(t.due, done), subs = subtasks(t.id);
  const waits = rows("deps", d => d.task_id === t.id).map(d => byId("tasks", d.blocked_by_id)).filter(b => b && b.status !== "Completed");
  const pend = rows("approvals", a => a.task_id === t.id && a.status === "REQUESTED").length;
  const msgs = rows("messages", m => m.thread === "task:" + t.id).length;
  return h("div", { class:"tcard" + (done ? " is-done" : "") + (t.private ? " priv" : ""), draggable:"true", "data-t":t.id,
      ondragstart:e => { dragTask = t.id; e.dataTransfer.effectAllowed = "move"; e.currentTarget.classList.add("dragging"); },
      ondragend:e => { e.currentTarget.classList.remove("dragging"); dragTask = null; },
      onclick:() => openTask(t.id) },
    statusCircle(t),
    h("div", { class:"tc-b" }, h("div", { class:"tc-n" }, t.name),
      h("div", { class:"tc-m" },
        h("span", { class:dl.late ? "late" : "" }, t.type === "MILESTONE" ? fmtD(t.due) : fmtRange(t.start, t.due)),
        t.at_risk && !done ? h("span", { class:"chip gold" }, "At risk") : null,
        waits.length ? h("span", { class:"chip", title:"Waiting on: " + waits.map(b => b.name).join(", ") }, icon("link", "xs"), waits.length) : null,
        pend ? h("span", { class:"chip gold", title:"Approval pending" }, icon("flag", "xs"), pend) : null,
        subs.length ? h("span", { class:"chip" }, subs.filter(s => s.status === "Completed").length + "/" + subs.length) : null,
        msgs ? h("span", { class:"chip" }, icon("chat", "xs"), msgs) : null,
        t.private ? h("span", { title:"Private — hidden from the customer", style:"color:var(--gold)" }, icon("lock", "xs")) : null,
        h("span", { class:"grow" }), avatars(t.assignee_ids))));
}
function phaseMenu(anchor, ph){
  openPop(anchor, [
    h("button", { class:"pop-i", onclick:() => { closePop(); textModal("Rename phase", "Phase name", ph.name, v => { update("phases", ph.id, { name:v }); commit(); }); } }, icon("pencil", "sm"), "Rename"),

  if(dayFrame) return;
  const src = $("ln-day-src").textContent.replace(/<\\\/script/g, "</script").replace(/<\\!--/g, "<!--");
  dayFrame = h("iframe", { title:"My Day" });
  dayFrame.srcdoc = src;
  $("ln-dayhost").appendChild(dayFrame);
}
function dayRefresh(){ try{ if(dayFrame && dayFrame.contentWindow && dayFrame.contentWindow.dayRefresh) dayFrame.contentWindow.dayRefresh(); }catch(e){} }

window.OrbitDay = {
  /* Project tasks assigned to me for a given day: due that day, plus anything
     overdue when the day is today, plus what I completed that day. */
  items(date, today){
    const u = me();
    return rows("tasks", t => !t.parent_id && liveProject(t) && (t.assignee_ids || []).indexOf(u.id) > -1 && (
        (t.status !== "Completed" && t.due === date) ||
        (date === today && t.status !== "Completed" && t.due && t.due < today) ||
        (t.status === "Completed" && t.due_actual === date)))
      .sort(by(t => (t.status === "Completed" ? "1" : "0") + (t.due || "")))
      .map(t => ({ id:t.id, title:t.name, project:(byId("projects", t.project_id) || {}).name || "", status:t.status,
                   done:t.status === "Completed", milestone:t.type === "MILESTONE",
                   late:t.status !== "Completed" && t.due < date ? diffDays(t.due, date) : 0 }));
  },
  approvals(){
    const u = me();
    return rows("approvals", a => a.status === "REQUESTED" && (a.approver_ids || []).indexOf(u.id) > -1).map(a => {
      const t = byId("tasks", a.task_id) || {};
      return { id:a.id, task_id:t.id, title:t.name, project:(byId("projects", t.project_id) || {}).name || "", from:firstName(a.requested_by), late:a.due < todayISO() };
    });
  },
  complete(id, done){
    const t = byId("tasks", id); if(!t) return;
    setTaskStatus(t, done ? "Completed" : (t.start_actual ? "In progress" : "To do")); commit();
  },
  open(id){ const t = byId("tasks", id); if(t) location.hash = "#/projects/" + t.project_id + "/plan?t=" + t.id; },
  log(id, text, date){ const m = parseHours(text); if(!m) return ""; logTime(id, date || todayISO(), m, "", true); commit(); return fmtMins(m); }
};

/* =====================================================================
   Boot
   ===================================================================== */
(function boot(){
  db = loadDb();
  if(!db || !db.meta || !db.meta.seeded) seedDb();
  if(!session.user || !byId("users", session.user)){ session.user = "u-anand"; saveSession(); }
  window.addEventListener("hashchange", render);
  if(!location.hash || location.hash === "#" || location.hash === "#/") history.replaceState(null, "", "#/home");
  render();
  if(syncConfigured()) sync();
  window.addEventListener("online", sync);
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible"){ scheduleRender(); if(syncConfigured()) sync(); } });
  /* Another tab saved — pick it up. */
  window.addEventListener("storage", e => { if(e.key === LS_DB){ db = loadDb() || db; scheduleRender(); } });
  setInterval(() => { if(!typing()) scheduleRender(); }, 60000);
  /* Pick up what Claude and other devices wrote, while this tab is in view. */
  setInterval(() => { if(syncConfigured() && document.visibilityState === "visible" && !syncing) sync(); }, 45000);
})();
