<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --page:#FFFFFF; --surf:#F5F3F7; --surf-2:#EDEAF1; --edge:#E6E2EB; --line:#DBD5E2;
  --text:#221C29; --muted:#6B6276; --faint:#8A8394;
  --jade:#2E8F6C; --jade-soft:#E4F1EB; --jade-ink:#1E6B4F;
  --gold:#A8700F; --gold-soft:#FBF1DF;
  --m1:#8B7A99; --m2:#6B7F9E; --m3:#4E9490; --m4:#3A9A72; --m5:#63B681;
  --display:"Fraunces",Georgia,serif;
  --body:"Instrument Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --pad:22px;
  --nav:226px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;
  padding:0 var(--pad) 70px;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
.wrap{max-width:680px;margin:0 auto}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:5px}
button{font-family:inherit}

/* header */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:22px 0 14px}
.datebox{display:flex;align-items:baseline;gap:10px;min-width:0}
.dnum{font-family:var(--display);font-size:33px;font-weight:300;line-height:1}
.dow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.dmon{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;align-items:center;gap:2px;flex:none}
.nav button{background:none;border:0;color:var(--faint);cursor:pointer;font-family:var(--mono);font-size:15px;
  width:31px;height:31px;border-radius:8px;display:grid;place-items:center;transition:color .15s,background .15s}
.nav button:hover{color:var(--text);background:var(--surf)}
.nav button[disabled]{opacity:.25;cursor:default}
.jump{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;width:auto!important;padding:0 9px;color:var(--gold)!important}

/* ribbon */
.ribbon{position:relative;height:38px;margin-bottom:6px;user-select:none}
.rtrack{position:absolute;left:0;right:0;top:13px;height:11px;background:var(--surf);border-radius:3px;overflow:hidden}
.rblock{position:absolute;top:0;bottom:0;background:var(--jade);opacity:.3}
.rblock.shift{opacity:.5}
.rblock.on{opacity:.85}
.rnow{position:absolute;top:8px;width:3px;height:21px;border-radius:2px;background:var(--gold);box-shadow:0 0 0 3px rgba(168,112,15,.15);transform:translateX(-1px)}
@media(prefers-reduced-motion:no-preference){.rnow{animation:breathe 3.6s ease-in-out infinite}}
@keyframes breathe{50%{box-shadow:0 0 0 6px rgba(168,112,15,.06)}}
.rlab{position:absolute;top:27px;font-family:var(--mono);font-size:9px;letter-spacing:.09em;color:var(--faint)}
.rlab.r{right:0}
.ribbon[data-live="0"] .rnow{display:none}

/* tabs */
.greet{padding:6px 2px 22px}
.greet .hi{font-family:var(--display);font-size:34px;font-weight:300;line-height:1.1;letter-spacing:-.01em}
.greet .mantra{font-family:var(--display);font-size:19px;font-weight:300;font-style:italic;
  color:var(--muted);margin-top:9px;line-height:1.35}
.greet .rule{height:1px;background:var(--edge);margin-top:20px}
@media(max-width:400px){.greet .hi{font-size:29px}.greet .mantra{font-size:17px}}

/* side nav */
.navbtn{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--edge);background:var(--page);
  color:var(--text);cursor:pointer;font-size:14px;align-self:center;line-height:1}
.navbtn:hover{background:var(--surf)}
.sidenav{
  position:fixed;left:0;top:0;bottom:0;width:var(--nav);background:var(--surf);
  border-right:1px solid var(--edge);z-index:30;overflow-y:auto;
  padding:24px 14px calc(16px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:3px;
  transform:translateX(-101%);transition:transform .24s cubic-bezier(.4,0,.2,1);
}
.sidenav.open{transform:none}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 20px}
.bmark{width:34px;height:34px;border-radius:10px;background:var(--text);color:var(--page);flex:none;
  display:grid;place-items:center;font-family:var(--display);font-size:17px;font-weight:300}
.bn{font-family:var(--display);font-size:17px;font-weight:300;line-height:1.15}
.bs{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:2px}
.nl{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;
  padding:10px 11px;border-radius:10px;cursor:pointer;font-size:14.5px;font-weight:500;
  color:var(--muted);transition:background .15s,color .15s}
.nl:before{content:"";width:3px;height:0;background:var(--gold);border-radius:2px;
  transition:height .18s;flex:none}
.nl:hover{background:var(--surf-2);color:var(--text)}
.nl[aria-current="page"]{background:var(--page);color:var(--text);box-shadow:0 1px 3px rgba(34,28,41,.08)}
.nl[aria-current="page"]:before{height:15px}
.navfoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--edge);display:flex;
  flex-direction:column;gap:9px}
.navfoot .status{justify-content:flex-start;padding:0 4px;flex-wrap:wrap}
.navfoot .nl{font-size:13px;padding:8px 11px}
.scrim{position:fixed;inset:0;background:rgba(34,28,41,.32);backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);z-index:29;display:none}
.scrim.open{display:block}
@media(min-width:1000px){
  .sidenav{transform:none}
  .navbtn{display:none}
  .scrim{display:none!important}
  body{padding-left:calc(var(--nav) + 40px);padding-right:40px}
}
.view{display:none}
.view.on{display:block}

/* sections */
.sec{margin-bottom:32px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.sec-head h2{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.19em;text-transform:uppercase;color:var(--faint)}
.sec-head .rule{flex:1;height:1px;background:var(--edge)}
.sec-head .meta{font-family:var(--mono);font-size:10px;color:var(--faint)}
.link{background:none;border:0;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.prompt{font-family:var(--display);font-size:20px;font-weight:300;line-height:1.35;margin-bottom:16px}
.empty{font-size:13.5px;color:var(--faint);font-style:italic;padding:3px 0}

/* dashboard */
.hero{border:1px solid var(--edge);border-radius:16px;padding:20px 22px;margin-bottom:14px;background:var(--surf)}
.hero .eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
.hero .big{font-family:var(--display);font-size:29px;font-weight:300;line-height:1.15}
.hero .sub{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:7px}
.hero.live{background:var(--gold-soft);border-color:#EBDCBC}
.hero.live .eyebrow{color:var(--gold)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.tile{border:1px solid var(--edge);border-radius:13px;padding:14px 12px;text-align:left}
.tile .v{font-family:var(--display);font-size:25px;font-weight:300;line-height:1}
.tile .k{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin-top:6px;line-height:1.35}

.bar{height:5px;background:var(--surf-2);border-radius:3px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--jade);border-radius:3px}

.mini{list-style:none}
.mini li{display:flex;align-items:baseline;gap:11px;padding:7px 0;border-bottom:1px solid var(--edge);font-size:14.5px}
.mini li:last-child{border-bottom:0}
.mini .when{font-family:var(--mono);font-size:10.5px;color:var(--faint);flex:none;width:62px}
.mini .what{flex:1;min-width:0}
.mini .dim{color:var(--faint)}

/* routine timeline */
.rl{list-style:none;position:relative}
.rl:before{content:"";position:absolute;left:53px;top:8px;bottom:8px;width:1px;background:var(--edge)}
.ri{display:flex;align-items:flex-start;gap:14px;padding:7px 8px 7px 0;border-radius:9px}
.ri:hover{background:var(--surf)}
.ri.now{background:var(--gold-soft)}
.ri .t{flex:none;width:46px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--faint);padding-top:4px}
.ri.now .t{color:var(--gold)}
.chk{flex:none;width:19px;height:19px;margin-top:2px;border-radius:50%;border:1.5px solid var(--line);
  background:var(--page);cursor:pointer;padding:0;display:grid;place-items:center;z-index:1;transition:border-color .15s,background .15s}
.chk:hover{border-color:var(--muted)}
.chk svg{width:10px;height:10px;opacity:0;stroke:#fff;stroke-width:3.2;fill:none;transition:opacity .15s}
.done .chk{background:var(--jade);border-color:var(--jade)}
.done .chk svg{opacity:1}
.ri .lab{flex:1;padding-top:2px;font-size:15px}
.ri.done .lab{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line)}
.ri .dur{font-family:var(--mono);font-size:10px;color:var(--faint);padding-top:5px}

/* tasks */
.tks{list-style:none}
.tk{display:flex;align-items:flex-start;gap:11px;padding:9px 8px;border-radius:9px}
.tk:hover{background:var(--surf)}
.tk .tt{flex:1;min-width:0}
.tk .tl{font-size:14.5px;line-height:1.4;word-break:break-word}
.tk.done .tl{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line)}
.tk .tm{font-family:var(--mono);font-size:10px;color:var(--gold);margin-top:2px}
.tk .kill{background:none;border:0;color:transparent;cursor:pointer;font-family:var(--mono);font-size:15px;padding:1px 4px}
.tk:hover .kill{color:var(--faint)}
.tk .kill:hover{color:var(--text)}
.addtask{display:flex;gap:7px;margin-top:9px}
.addtask input[type=text]{flex:1;min-width:0;background:var(--surf);border:1px solid var(--edge);border-radius:10px;
  color:var(--text);font:inherit;font-size:14px;padding:10px 13px}
.addtask input[type=time]{background:var(--surf);border:1px solid var(--edge);border-radius:10px;color:var(--muted);
  font-family:var(--mono);font-size:12px;padding:9px;width:104px;flex:none}
.addtask input:focus{outline:none;border-color:var(--line)}
.addtask input::placeholder{color:var(--faint)}

/* mood */
.moodrow{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.dots{display:flex;gap:10px}
.dot{width:29px;height:29px;border-radius:50%;cursor:pointer;border:1.5px solid var(--line);background:transparent;padding:0;
  transition:transform .18s cubic-bezier(.34,1.6,.64,1),border-color .18s,background .18s}
.dot:hover{border-color:var(--muted);transform:scale(1.08)}
.dot[aria-pressed="true"]{border-color:transparent;transform:scale(1.13)}
.dot[data-m="1"][aria-pressed="true"]{background:var(--m1)}
.dot[data-m="2"][aria-pressed="true"]{background:var(--m2)}
.dot[data-m="3"][aria-pressed="true"]{background:var(--m3)}
.dot[data-m="4"][aria-pressed="true"]{background:var(--m4)}
.dot[data-m="5"][aria-pressed="true"]{background:var(--m5)}
.moodword{font-family:var(--display);font-size:22px;font-weight:300;font-style:italic;color:var(--muted)}
.moodword:empty{display:none}

/* journal / textareas */
.jq{margin-bottom:15px}
.jq label{display:block;font-family:var(--display);font-size:17px;font-weight:300;margin-bottom:7px}
.ta{width:100%;background:var(--surf);border:1px solid var(--edge);border-radius:12px;color:var(--text);font:inherit;
  line-height:1.6;padding:13px 15px;resize:none;overflow:hidden;min-height:52px;transition:border-color .18s,background .18s}
.ta:focus{outline:none;border-color:var(--line);background:var(--page)}
.ta::placeholder{color:var(--faint)}
.notes{min-height:110px}

/* food slots + chips */
.slot{margin-bottom:20px}
.slot-h{display:flex;align-items:baseline;gap:9px;margin-bottom:8px}
.slot-h h3{font-size:14px;font-weight:600}
.slot-h .when{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--page);color:var(--muted);border-radius:999px;padding:7px 14px;
  font-size:13.5px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--muted);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--jade-soft);border-color:var(--jade);color:var(--jade-ink);font-weight:500}
.chip.ate{background:var(--jade);border-color:var(--jade);color:#fff;font-weight:500}
.chip .x{margin-left:7px;opacity:.5}

/* modes */
.modes{display:flex;gap:8px;flex-wrap:wrap}
.mode{flex:1;min-width:94px;border:1px solid var(--line);background:var(--page);border-radius:12px;padding:11px 10px;
  cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.mode:hover{border-color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--jade);background:var(--jade-soft)}
.mode .mn{font-size:13.5px;font-weight:600}
.mode .ms{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:2px}
.mode[aria-pressed="true"] .ms{color:#3E7A63}

/* calendar */
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.calnav .mlab{font-family:var(--display);font-size:21px;font-weight:300}
.calnav .grp{display:flex;gap:2px}
.calnav button{background:none;border:0;color:var(--faint);cursor:pointer;font-family:var(--mono);font-size:15px;
  width:31px;height:31px;border-radius:8px;display:grid;place-items:center}
.calnav button:hover{color:var(--text);background:var(--surf)}
.dowrow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
.dowrow span{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{position:relative;border:1px solid var(--edge);border-radius:10px;background:var(--page);cursor:pointer;
  padding:5px 5px 4px;min-height:56px;text-align:left;overflow:hidden;transition:border-color .15s,background .15s}
.cell:hover{border-color:var(--line);background:var(--surf)}
.cell.out{opacity:.32}
.cell.today{border-color:var(--gold)}
.cell.sel{border-color:var(--jade);background:var(--jade-soft)}
.cell .n{font-family:var(--mono);font-size:11px;color:var(--muted);display:block;line-height:1.3}
.cell.today .n{color:var(--gold);font-weight:500}
.cell .mdot{position:absolute;top:6px;right:5px;width:6px;height:6px;border-radius:50%}
.cell .evs{margin-top:3px;display:flex;flex-direction:column;gap:2px}
.ev{font-size:9.5px;line-height:1.3;padding:1px 4px;border-radius:4px;background:var(--surf-2);color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.done{opacity:.5;text-decoration:line-through}
.ev.more{background:none;color:var(--faint);padding-left:2px}
.dotrow{display:flex;gap:2.5px;margin-top:4px;flex-wrap:wrap}
.tdot{width:4.5px;height:4.5px;border-radius:50%;background:var(--line)}
.tdot.done{background:var(--jade)}
@media(max-width:520px){.cell{min-height:48px}.cell .evs{display:none}}
@media(min-width:521px){.dotrow{display:none}}

/* day panel */
.daypanel{border:1px solid var(--edge);border-radius:16px;padding:20px;margin-top:20px;background:var(--surf)}
.daypanel h3{font-family:var(--display);font-size:22px;font-weight:300;margin-bottom:2px}
.daypanel .dsub{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:18px}
.daypanel .sec{margin-bottom:22px}
.daypanel .sec:last-of-type{margin-bottom:0}
.daypanel .chip{background:var(--page)}
.daypanel .addtask input,.daypanel .ta{background:var(--page)}
.daypanel .tk:hover{background:var(--page)}
.daypanel .mode{background:var(--page)}
.daypanel .mode[aria-pressed="true"]{background:var(--jade-soft)}

/* buttons */
.btn{padding:11px 17px;border-radius:11px;border:1px solid var(--line);background:var(--page);color:var(--text);
  font:inherit;font-size:14.5px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surf-2)}
.btn.primary{background:var(--jade);color:#fff;border-color:var(--jade);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.45;cursor:default;filter:none}
.btn.wide{width:100%}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}
.after{font-size:12.5px;color:var(--faint);margin-top:9px;line-height:1.5}
.toggles{display:flex;gap:14px;margin-bottom:11px;flex-wrap:wrap}
.tg{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.tg input{accent-color:var(--jade);width:15px;height:15px}

/* library rows */
.lib-add{display:flex;gap:8px;margin-top:9px}
.lib-add input{flex:1;background:var(--surf);border:1px solid var(--edge);border-radius:10px;color:var(--text);
  font:inherit;font-size:14px;padding:9px 13px}
.lib-add input:focus{outline:none;border-color:var(--line)}
.blk{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--edge)}
.blk:last-of-type{border-bottom:0}
.blk input[type=text]{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;font-size:14.5px;padding:4px 0}
.blk input[type=time]{background:var(--surf);border:1px solid var(--edge);border-radius:8px;color:var(--muted);
  font-family:var(--mono);font-size:12px;padding:5px 7px}
.blk input:focus{outline:none}
.blk .kill{background:none;border:0;color:var(--faint);cursor:pointer;font-family:var(--mono);font-size:15px;padding:2px 5px}
.blk .kill:hover{color:var(--text)}

/* month / day switch + day time grid */
.seg{display:flex;gap:3px;background:var(--surf);border-radius:9px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:7px 4px;border-radius:7px;font-size:13px;font-weight:500;
  color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--page);color:var(--text);box-shadow:0 1px 3px rgba(34,28,41,.09)}
.dcols{display:flex;margin:2px 0 8px 48px;font-family:var(--mono);font-size:9px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint)}
.dcols span:first-child{width:56%}
.dg{position:relative;margin-left:48px;border-left:1px solid var(--edge)}
.dgline{position:absolute;left:0;right:0;height:1px;background:var(--edge)}
.dgh{position:absolute;left:-48px;width:41px;text-align:right;font-family:var(--mono);font-size:9.5px;
  color:var(--faint);transform:translateY(-5px)}
.dgb{position:absolute;border-radius:8px;padding:3px 8px;overflow:hidden;
  background:var(--jade-soft);border-left:3px solid var(--jade)}
.dgb.rt{left:5px;width:calc(56% - 10px)}
.dgb.meal,.dgb.task{left:58%;right:0}
.dgb.meal{background:var(--gold-soft);border-left-color:var(--gold)}
.dgb.task{background:var(--surf-2);border-left-color:var(--muted)}
.dgb .bl{font-size:12.5px;font-weight:500;color:#1B6449;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;line-height:1.35}
.dgb .bt{font-family:var(--mono);font-size:9px;color:#3E7A63;line-height:1.35;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.dgb.meal .bl{color:#7A5309}.dgb.meal .bt{color:#8A6212}
.dgb.task .bl{color:var(--text)}.dgb.task .bt{color:var(--faint)}
.dgb.done{opacity:.45}
.dgnow{position:absolute;left:-7px;right:0;height:2px;background:var(--gold);z-index:3;pointer-events:none}
.dgnow:after{content:"";position:absolute;left:0;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.slot-time{background:var(--surf);border:1px solid var(--edge);border-radius:8px;color:var(--muted);
  font-family:var(--mono);font-size:11px;padding:3px 6px;margin-left:auto}

/* task editor */
.tk .edit{background:none;border:0;color:transparent;cursor:pointer;font-family:var(--mono);font-size:13px;padding:1px 4px}
.tk:hover .edit{color:var(--faint)}
.tk .edit:hover{color:var(--text)}
.tk.open-ed .edit{color:var(--text)}
.tked{background:var(--surf);border:1px solid var(--edge);border-radius:12px;padding:15px;margin:0 0 10px}
.tked .fr{display:flex;gap:9px;margin-bottom:11px;flex-wrap:wrap}
.tked .fr>div{flex:1;min-width:138px}
.tked label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);margin-bottom:5px}
.tked input,.tked select,.tked textarea{width:100%;background:var(--page);border:1px solid var(--edge);
  border-radius:9px;color:var(--text);font-family:var(--body);font-size:13.5px;padding:8px 10px}
.tked input[type=datetime-local]{font-family:var(--mono);font-size:12px}
.tked textarea{resize:none;line-height:1.55;min-height:58px}
.tked input:focus,.tked select:focus,.tked textarea:focus{outline:none;border-color:var(--line)}
.badge{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
  padding:2px 7px;border-radius:999px;margin-top:4px}
.badge.ontime{background:var(--jade-soft);color:#1B6449}
.badge.late{background:var(--gold-soft);color:#7A5309}
.badge.missed{background:#FBE7E7;color:#9A3B3B}
.badge.open{background:var(--surf-2);color:var(--muted)}

/* review */
.tiles.four{grid-template-columns:repeat(4,1fr)}
.tiles.four .tile{padding:13px 9px}
.tiles.four .tile .v{font-size:22px}
.bars{display:flex;flex-direction:column;gap:7px}
.barrow{display:flex;align-items:center;gap:10px}
.barrow .bd{font-family:var(--mono);font-size:9.5px;color:var(--faint);width:54px;flex:none}
.barrow .bw{flex:1;display:flex;height:15px;border-radius:5px;overflow:hidden;background:var(--surf)}
.barrow .bs{height:100%}
.barrow .bs.ontime{background:var(--jade)}
.barrow .bs.late{background:var(--gold)}
.barrow .bs.missed{background:#C46A6A}
.barrow .bn{font-family:var(--mono);font-size:9.5px;color:var(--faint);width:24px;text-align:right;flex:none}
.keyrow{display:flex;gap:15px;justify-content:center;margin-top:15px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.07em;color:var(--faint)}
.keyrow span{display:flex;align-items:center;gap:5px}
.keyrow i{width:8px;height:8px;border-radius:3px;display:block}
.mini .rmk{font-size:12.5px;color:var(--faint);font-style:italic;margin-top:3px;line-height:1.45}

/* rich text fields */
.rtbar{display:flex;gap:3px;margin-bottom:7px}
.rtbar button{border:0;background:none;color:var(--faint);cursor:pointer;width:30px;height:27px;
  border-radius:8px;display:grid;place-items:center;transition:background .15s,color .15s}
.rtbar button:hover{background:var(--surf-2);color:var(--text)}
.rtbar button.on{background:var(--jade-soft);color:var(--jade)}
.rt{width:100%;background:var(--surf);border:1px solid var(--edge);border-radius:12px;
  color:var(--text);font:inherit;line-height:1.65;padding:13px 15px;min-height:52px;
  transition:border-color .18s,background .18s}
.rt.tall{min-height:110px}
.rt:focus{outline:none;border-color:var(--line);background:var(--page)}
.rt:empty:before{content:attr(data-ph);color:var(--faint)}
.rt>*:first-child{margin-top:0}
.rt>*:last-child{margin-bottom:0}
.rt p,.rt div{margin:0 0 5px}
.rt ul,.rt ol{margin:5px 0;padding-left:21px}
.rt ul{list-style:disc}
.rt ol{list-style:decimal}
.rt li{margin-bottom:3px}
.rt ul.cl{list-style:none;padding-left:1px}
.rt ul.cl li{display:flex;align-items:flex-start;gap:9px}
.rt ul.cl input[type=checkbox]{flex:none;margin-top:5px;width:15px;height:15px;
  accent-color:var(--jade);cursor:pointer}
.rt ul.cl li:has(input:checked){color:var(--faint);text-decoration:line-through;
  text-decoration-color:var(--line)}
.rt b,.rt strong{font-weight:600;color:var(--text)}

/* rich text fields end */
/* history */


.hist{display:flex;gap:5px;flex-wrap:wrap}
.hcell{max-width:26px;aspect-ratio:1;flex:1 1 20px;border-radius:7px;background:var(--surf);border:1.5px solid transparent;
  cursor:pointer;padding:0;transition:transform .15s}
.hcell:hover{transform:translateY(-2px)}
.hcell[data-m="1"]{background:var(--m1)}
.hcell[data-m="2"]{background:var(--m2)}
.hcell[data-m="3"]{background:var(--m3)}
.hcell[data-m="4"]{background:var(--m4)}
.hcell[data-m="5"]{background:var(--m5)}
.hcell.sel{border-color:var(--gold)}
.histfoot{display:flex;justify-content:space-between;margin-top:9px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--faint)}

/* status + sheet */
.status{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--faint);padding-top:6px}
.status button{background:none;border:0;color:var(--faint);cursor:pointer;font:inherit;letter-spacing:inherit;text-decoration:underline;text-underline-offset:3px}
.status button:hover{color:var(--text)}
.pip{width:5px;height:5px;border-radius:50%;background:var(--faint);flex:none}
.pip.ok{background:var(--jade)}
.pip.warn{background:var(--gold)}
.sheet{position:fixed;inset:0;background:rgba(34,28,41,.3);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.open{display:flex}
.panel{background:var(--page);border:1px solid var(--edge);box-shadow:0 -10px 50px rgba(34,28,41,.16);
  border-radius:18px 18px 0 0;width:100%;max-width:680px;padding:26px var(--pad) calc(30px + env(safe-area-inset-bottom));
  max-height:88vh;overflow:auto}
@media(min-width:700px){.sheet{align-items:center}.panel{border-radius:18px}}
.panel h3{font-family:var(--display);font-size:22px;font-weight:300;margin-bottom:4px}
.panel .sub{color:var(--muted);font-size:14px;margin-bottom:20px}
.field{margin-bottom:15px}
.field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.field input,.field select{width:100%;background:var(--surf);border:1px solid var(--edge);border-radius:10px;color:var(--text);
  font-family:var(--mono);font-size:13px;padding:11px 13px}
.field input:focus,.field select:focus{outline:none;border-color:var(--line)}
.field .hint{font-size:12px;color:var(--faint);margin-top:5px;line-height:1.45}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:400px){:root{--pad:15px}.dnum{font-size:29px}.ri .t{width:42px}.rl:before{left:49px}}

/* monthly planner */
.plmeta{font-family:var(--mono);font-size:10px;color:var(--faint)}
.plrow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--edge)}
.plrow:last-child{border-bottom:0}
.plrow .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.plrow .grow input{background:none;border:0;color:var(--text);font:inherit;font-size:14.5px;padding:2px 0;width:100%}
.plrow .grow input.sub{font-family:var(--mono);font-size:11px;color:var(--muted)}
.plrow .grow input:focus{outline:none}
.plrow .chk{margin-top:0}
.chk.done{background:var(--jade);border-color:var(--jade)}
.chk.done svg{opacity:1}
.plrow .kill{background:none;border:0;color:var(--faint);cursor:pointer;font-family:var(--mono);font-size:15px;padding:2px 5px;flex:none}
.plrow .kill:hover{color:var(--text)}
.plrow input[type=date]{background:var(--surf);border:1px solid var(--edge);border-radius:8px;color:var(--muted);
  font-family:var(--mono);font-size:11px;padding:5px 7px;flex:none}
.pill{flex:none;border:1px solid var(--line);background:var(--page);color:var(--muted);border-radius:999px;
  padding:4px 11px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.pill.go{background:var(--gold-soft);border-color:#EBDCBC;color:var(--gold)}
.pill.ok{background:var(--jade);border-color:var(--jade);color:#fff;font-weight:500}
.pill.off{opacity:.55;text-decoration:line-through}
.tgt{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tgt label{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.num{background:var(--surf);border:1px solid var(--edge);border-radius:9px;color:var(--text);
  font-family:var(--mono);font-size:13px;padding:7px 9px;width:92px;text-align:right}
.num:focus{outline:none;border-color:var(--line)}
.num.wide{width:124px}
.pj{border-bottom:1px solid var(--edge)}
.pj:last-child{border-bottom:0}
.pj .plrow{border-bottom:0}
.pj .edit{flex:none;background:none;border:0;color:var(--faint);cursor:pointer;font-size:15px;padding:2px 6px;line-height:1}
.pj .edit:hover{color:var(--text)}
.pj.open .edit{color:var(--text)}
.pgline{display:flex;align-items:center;gap:10px;padding:0 0 10px 0}
.pgline .bar{flex:1;margin-top:0}
.pgline .pc{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;color:var(--faint);flex:none}
.plan{background:var(--surf);border:1px solid var(--edge);border-radius:12px;padding:13px 14px;margin:0 0 13px}
.plan h4{font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);margin-bottom:9px}
.stp{display:flex;align-items:center;gap:9px;padding:6px 0}
.stp+.stp{border-top:1px solid var(--edge)}
.stp .chk{margin-top:0}
.stp .txt{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;font-size:14px;padding:3px 0}
.stp .txt:focus{outline:none}
.stp.is-done .txt{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line)}
.stp input[type=date]{background:var(--page);border:1px solid var(--edge);border-radius:8px;color:var(--muted);
  font-family:var(--mono);font-size:10.5px;padding:5px 7px;flex:none}
.stp .kill{background:none;border:0;color:var(--faint);cursor:pointer;font-family:var(--mono);font-size:15px;
  padding:2px 4px;flex:none}
.stp .kill:hover{color:var(--text)}
.stp.recov{padding-left:16px;position:relative}
.stp.recov::before{content:"";position:absolute;left:5px;top:50%;width:7px;height:1px;background:var(--line)}
.stp.recov .rlab{font-family:var(--mono);font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--gold);flex:none}
.fixrow{display:flex;justify-content:flex-end;padding:2px 0 6px}
.fixbtn{background:var(--gold-soft);border:1px solid #EBDCBC;color:var(--gold);border-radius:9px;
  padding:5px 11px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.fixbtn:hover{filter:brightness(.97)}
.stepadd{display:flex;gap:7px;margin-top:9px}
.stepadd input[type=text]{flex:1;background:var(--page);border:1px solid var(--edge);border-radius:9px;
  color:var(--text);font:inherit;font-size:13.5px;padding:8px 11px}
.stepadd input[type=text]:focus{outline:none;border-color:var(--line)}
.stepadd .btn{padding:8px 13px;font-size:13px}
/* On a phone the step row runs out of room once a date and a Missed badge are
   both present, and the date input won't shrink — so let it wrap instead. */
@media(max-width:560px){
  .stp{flex-wrap:wrap;row-gap:6px}
  .stp .txt{flex:1 0 100%;order:-1;padding-left:28px}
  .stp.recov .txt{padding-left:0}
  .stepadd{flex-wrap:wrap}
  .stepadd input[type=text]{flex:1 0 100%}
}
.mrow{display:flex;align-items:center;gap:7px;padding:7px 0;border-bottom:1px solid var(--edge)}
.mrow:last-of-type{border-bottom:0}
.mrow .mn{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;font-size:14.5px;padding:3px 0}
.mrow .mn:focus{outline:none}
.mrow .num{width:84px;padding:6px 8px;font-size:12.5px}
.mhead{display:flex;gap:7px;padding-bottom:6px}
.mhead .sp{flex:1}
.mhead span.h{width:84px;text-align:right;font-family:var(--mono);font-size:9px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint)}
.mhead .gap{width:25px;flex:none}
.msum{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:14px;
  padding-top:13px;border-top:1px solid var(--line)}
.msum .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.msum .val{font-family:var(--display);font-size:24px;font-weight:300;line-height:1}
.msum .val.over{color:#9A3B3B}

/* ---- Orbit bridge: "From projects" ---- */
.orbit .tk .proj{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:.02em}
.orbit .tk .late{color:#9A3B3B}
.orbit .tk .go{background:none;border:0;color:var(--faint);cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 5px;flex:none}
.orbit .tk .go:hover{color:var(--text)}
.orbit .tk .logt{width:74px;background:var(--surf);border:1px solid var(--edge);border-radius:8px;font-family:var(--mono);font-size:11px;padding:4px 6px;color:var(--text)}
.orbit .tk .ms{color:#7457A6;font-size:12px;margin-right:4px}
.orbit .appr .chk{border-color:var(--gold);background:var(--gold-soft)}
</style>
</head>
<body>
<div class="scrim" id="navScrim"></div>
<nav class="sidenav" id="sideNav" aria-label="Sections">
  <div class="brand">
    <div class="bmark">D</div>
    <div>
      <div class="bn">Day</div>
      <div class="bs" id="brandName">Anand</div>
    </div>
  </div>
  <button class="nl" data-v="home" aria-current="page">Home</button>
  <button class="nl" data-v="today">Today</button>
  <button class="nl" data-v="calendar">Calendar</button>
  <button class="nl" data-v="planner">Planner</button>
  <button class="nl" data-v="review">Review</button>
  <button class="nl" data-v="library">Library</button>
  <div class="navfoot">
    <button class="nl" id="gear">Settings</button>
    <div class="status">
      <span class="pip" id="pip"></span>
      <span id="statusText">Not connected</span>
      <button id="statusBtn">Set up sync</button>
    </div>
  </div>
</nav>

<div class="wrap">

  <header class="top">
    <button class="navbtn" id="navToggle" aria-label="Open menu" aria-expanded="false">☰</button>
    <div class="datebox">
      <span class="dnum" id="dNum">—</span>
      <div><div class="dow" id="dDow">&nbsp;</div><div class="dmon" id="dMon">&nbsp;</div></div>
    </div>
    <nav class="nav">
      <button id="prev" title="Previous day">‹</button>
      <button id="jump" class="jump">Today</button>
      <button id="next" title="Next day">›</button>
    </nav>
  </header>

  <div class="ribbon" id="ribbon">
    <div class="rtrack" id="rtrack"></div>
    <div class="rnow" id="rnow"></div>
    <span class="rlab" id="rL"></span>
    <span class="rlab r" id="rR"></span>
  </div>


  <\!-- ============ HOME ============ -->
  <div class="view on" id="v-home">
    <div class="greet">
      <div class="hi" id="greetHi"></div>
      <div class="mantra" id="greetMantra"></div>
      <div class="rule"></div>
    </div>
    <div class="hero" id="hero"></div>
    <div class="tiles" id="tiles"></div>
    <section class="sec" id="orbitHome"></section>

    <section class="sec">
      <div class="sec-head"><h2>Open today</h2><div class="rule"></div><span class="meta" id="openMeta"></span></div>
      <ul class="mini" id="openList"></ul>
    </section>

    <section class="sec">
      <div class="sec-head"><h2>Coming up</h2><div class="rule"></div></div>
      <ul class="mini" id="upcoming"></ul>
    </section>

    <section class="sec">
      <div class="sec-head"><h2>This week</h2><div class="rule"></div><span class="meta" id="weekMeta"></span></div>
      <div id="weekBars"></div>
    </section>

    <section class="sec">
      <div class="sec-head"><h2>Last three weeks</h2><div class="rule"></div></div>
      <div class="hist" id="hist"></div>
      <div class="histfoot"><span id="histL"></span><span id="histR"></span></div>
    </section>
  </div>

  <\!-- ============ TODAY ============ -->
  <div class="view" id="v-today">
    <section class="sec">
      <p class="prompt" id="prompt"></p>
      <div class="moodrow"><div class="dots" id="dots"></div><span class="moodword" id="moodWord"></span></div>
    </section>

    <section class="sec" id="orbitToday"></section>

    <section class="sec">
      <div class="sec-head"><h2>Tasks</h2><div class="rule"></div><span class="meta" id="tMeta"></span></div>
      <ul class="tks" id="taskList"></ul>
      <div class="addtask">
        <input type="text" id="addTaskT" placeholder="Add a task">
        <input type="time" id="addTaskTime" title="Starts">
        <input type="time" id="addTaskEnd" title="Ends">
      </div>
    </section>

    <section class="sec">
      <div class="sec-head"><h2>Routine</h2><div class="rule"></div><span class="meta" id="rMeta"></span></div>
      <ul class="rl" id="routineList"></ul>
    </section>

    <section class="sec">
      <div class="sec-head"><h2>Journal</h2><div class="rule"></div><span class="meta" id="jTime"></span></div>
      <div id="journal"></div>
    </section>

    <section class="sec">
      <div class="sec-head"><h2>Food</h2><div class="rule"></div><button class="link" id="toCal">Edit plan</button></div>
      <div id="ateSlots"></div>
    </section>

    <section class="sec">
      <div class="sec-head"><h2>Notes</h2><div class="rule"></div></div>
      <div id="notesBox"></div>
    </section>
  </div>

  <\!-- ============ CALENDAR ============ -->
  <div class="view" id="v-calendar">
    <div class="calnav">
      <span class="mlab" id="mLab"></span>
      <div class="grp">
        <button id="mPrev" title="Previous month">‹</button>
        <button id="mToday" class="jump" style="width:auto;padding:0 9px">This month</button>
        <button id="mNext" title="Next month">›</button>
      </div>
    </div>
    <div class="seg" id="calSeg">
      <button data-c="month" aria-pressed="true">Month</button>
      <button data-c="day" aria-pressed="false">Day</button>
    </div>
    <div id="monthWrap">
      <div class="dowrow" id="dowRow"></div>
      <div class="cal" id="calGrid"></div>
    </div>
    <div id="dayWrap" style="display:none">
      <div class="dcols"><span>Routine</span><span>Tasks &amp; food</span></div>
      <div class="dg" id="dayGrid"></div>
    </div>
    <div class="daypanel" id="dayPanel"></div>
  </div>

  <\!-- ============ PLANNER ============ -->
  <div class="view" id="v-planner">
    <div class="calnav">
      <span class="mlab" id="plLab"></span>
      <div class="grp">
        <button id="plPrev" title="Previous month">‹</button>
        <button id="plNow" class="jump" style="width:auto;padding:0 9px">This month</button>
        <button id="plNext" title="Next month">›</button>
      </div>
    </div>
    <p class="prompt">What this month is for.</p>
    <div class="tiles" id="plTiles"></div>

    <section class="sec">
      <div class="sec-head"><h2>Books</h2><div class="rule"></div><span class="meta" id="plBooksMeta"></span></div>
      <div id="plBooks"></div>
      <div class="lib-add">
        <input id="addBook" placeholder="Add a book — title">
        <button class="btn" id="addBookBtn">Add</button>
      </div>
    </section>

    <section class="sec">
      <div class="sec-head"><h2>Professional projects</h2><div class="rule"></div><span class="meta" id="plProjMeta"></span></div>
      <div id="plProj"></div>
      <div class="lib-add">
        <input id="addProj" placeholder="Add a project">
        <button class="btn" id="addProjBtn">Add</button>
      </div>
    </section>

    <section class="sec">
      <div class="sec-head"><h2>Podcasts — finance &amp; economics</h2><div class="rule"></div><span class="meta" id="plPodMeta"></span></div>
      <div class="tgt">
        <label for="plPodTgt">Target this month</label>
        <input id="plPodTgt" class="num" type="number" min="0" step="1" inputmode="numeric">
      </div>
      <div id="plPods"></div>
      <div class="lib-add">
        <input id="addPod" placeholder="Add a podcast or episode">
        <button class="btn" id="addPodBtn">Add</button>
      </div>
    </section>

    <section class="sec">
      <div class="sec-head"><h2>Photoshoots</h2><div class="rule"></div><span class="meta" id="plShootMeta"></span></div>
      <div class="tgt">
        <label for="plShootTgt">Target this month</label>
        <input id="plShootTgt" class="num" type="number" min="0" step="1" inputmode="numeric">
      </div>
      <div id="plShoots"></div>
      <div class="lib-add">
        <input id="addShoot" placeholder="Add a shoot — the concept">
        <button class="btn" id="addShootBtn">Add</button>
      </div>
    </section>

    <section class="sec">
      <div class="sec-head"><h2>Gym</h2><div class="rule"></div><span class="meta" id="plGymMeta"></span></div>
      <div class="hero" id="plGymHero"></div>
      <div class="tgt">
        <label for="plGymTgt">Sessions target</label>
        <input id="plGymTgt" class="num" type="number" min="0" step="1" inputmode="numeric">
      </div>
      <div class="tgt">
        <label for="plWStart">Weight start</label>
        <input id="plWStart" class="num" type="number" step="0.1" inputmode="decimal">
        <label for="plWNow">Now</label>
        <input id="plWNow" class="num" type="number" step="0.1" inputmode="decimal">
        <label for="plWTgt">Target</label>
        <input id="plWTgt" class="num" type="number" step="0.1" inputmode="decimal">
      </div>
    </section>

    <section class="sec">
      <div class="sec-head"><h2>Money</h2><div class="rule"></div><span class="meta" id="plMoneyMeta"></span></div>
      <div class="tgt">
        <label for="plIncome">Income</label>
        <input id="plIncome" class="num wide" type="number" step="1" inputmode="numeric">
        <label for="plSaveTgt">Save target</label>
        <input id="plSaveTgt" class="num wide" type="number" step="1" inputmode="numeric">
        <label for="plSaveAct">Saved</label>
        <input id="plSaveAct" class="num wide" type="number" step="1" inputmode="numeric">
      </div>
      <div class="mhead"><span class="sp"></span><span class="h">Planned</span><span class="h">Actual</span><span class="gap"></span></div>
      <div id="plCats"></div>
      <div class="lib-add">
        <input id="addCat" placeholder="Add a spend category — e.g. Rent">
        <button class="btn" id="addCatBtn">Add</button>
      </div>
      <div id="plMoneySum"></div>
    </section>
  </div>

  <\!-- ============ REVIEW ============ -->
  <div class="view" id="v-review">
    <div class="hero" id="revHero"></div>
    <div class="seg" id="revSeg">
      <button data-r="7" aria-pressed="true">7 days</button>
      <button data-r="30" aria-pressed="false">30 days</button>
      <button data-r="90" aria-pressed="false">90 days</button>
    </div>
    <div class="tiles four" id="revTiles"></div>

    <section class="sec">
      <div class="sec-head"><h2>Day by day</h2><div class="rule"></div><span class="meta" id="revBarMeta"></span></div>
      <div class="bars" id="revBars"></div>
      <div class="keyrow">
        <span><i style="background:var(--jade)"></i>On time</span>
        <span><i style="background:var(--gold)"></i>Late</span>
        <span><i style="background:#C46A6A"></i>Missed</span>
      </div>
    </section>

    <section class="sec">
      <div class="sec-head"><h2>Missed and late</h2><div class="rule"></div><span class="meta" id="revMissMeta"></span></div>
      <ul class="mini" id="revMiss"></ul>
    </section>
  </div>

  <\!-- ============ LIBRARY ============ -->
  <div class="view" id="v-library">
    <section class="sec">
      <p class="prompt">The things you choose from.</p>
      <div class="sec-head"><h2>Foods</h2><div class="rule"></div></div>
      <div id="libFoods"></div>
    </section>
    <section class="sec">
      <div class="sec-head"><h2>Routines</h2><div class="rule"></div></div>
      <div class="modes" id="libModes" style="margin-bottom:18px"></div>
      <div id="libBlocks"></div>
      <div class="lib-add">
        <input id="addBlock" placeholder="Add a block — e.g. Gym">
        <button class="btn" id="addBlockBtn">Add</button>
      </div>
    </section>
    <section class="sec">
      <div class="sec-head"><h2>Journal questions</h2><div class="rule"></div></div>
      <div id="libPrompts"></div>
      <div class="lib-add">
        <input id="addPrompt" placeholder="Add a question">
        <button class="btn" id="addPromptBtn">Add</button>
      </div>
    </section>
  </div>

</div>

<div class="sheet" id="sheet">
  <div class="panel" role="dialog" aria-modal="true" aria-label="Settings">
    <h3>Settings</h3>
    <p class="sub">Stored on this device only. You'll paste these once per device.</p>
    <div class="field">
      <label for="fUrl">Apps Script web app URL</label>
      <input id="fUrl" placeholder="https://script.google.com/macros/s/.../exec" spellcheck="false"
        autocomplete="off" autocapitalize="off" autocorrect="off" inputmode="url">
      <div class="hint">Ends in /exec. From Deploy → New deployment → Web app.</div>
    </div>
    <div class="field">
      <label for="fToken">Shared secret</label>
      <input id="fToken" placeholder="same string as SECRET in Code.gs" spellcheck="false"
        autocomplete="off" autocapitalize="off" autocorrect="off">
    </div>
    <div class="field">
      <label for="fName">Your name</label>
      <input id="fName" placeholder="Anand" autocomplete="off">
      <div class="hint">Used for the greeting on Home.</div>
    </div>
    <div class="field">
      <label for="fMantra">The line under it</label>
      <input id="fMantra" placeholder="Remember who you are" autocomplete="off">
    </div>
    <div class="field">
      <label for="fTz">Show times in</label>
      <select id="fTz">
        <option value="Asia/Kolkata">India — Asia/Kolkata</option>
        <option value="">This device's timezone</option>
        <option value="America/New_York">US Eastern</option>
        <option value="America/Chicago">US Central</option>
        <option value="America/Los_Angeles">US Pacific</option>
        <option value="Europe/London">UK — London</option>
        <option value="UTC">UTC</option>
      </select>
      <div class="hint">Keep this on India even when your laptop is set to US time for the shift. Times you type are stored exactly as written — this only decides what the app thinks "now" is.</div>
    </div>
    <div class="field">
      <label for="fRoll">New day begins at</label>
      <input id="fRoll" type="time" value="03:00">
      <div class="hint">Before this hour the app still shows the previous day, so a 12:20 AM entry lands on the day you actually lived.</div>
    </div>
    <div class="btnrow">
      <button class="btn" id="cancelBtn" style="flex:1">Cancel</button>
      <button class="btn primary" id="saveBtn" style="flex:1">Save</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============ seed data (from your notebook) ============ */
var SLOTS = [
  { id:"pregym",    name:"Morning, pre-gym", when:"before 10:00" },
  { id:"office",    name:"Office",           when:"during shift" },
  { id:"afternoon", name:"Afternoon",        when:"midday" },
  { id:"dinner",    name:"Dinner",           when:"evening" }
];
var SEED_FOODS = [
  ["pregym","Kondakadalai"],["pregym","Milk"],["pregym","Eggs"],["pregym","Red banana ×2"],["pregym","Green gram"],
  ["office","Wheat bread"],["office","Peanut butter"],["office","Dark chocolate"],["office","Diet coke"],["office","Drink"],
  ["afternoon","Rice"],["afternoon","Sambar"],["afternoon","Curd"],["afternoon","Dal"],["afternoon","Eggs — 2 boiled"],
  ["afternoon","Veggies"],["afternoon","Chicken"],
  ["dinner","Ghee roast"],["dinner","Chapathi"],["dinner","Idly"],["dinner","Dosa"]
].map(function(f,i){ return { id:"f"+i, slot:f[0], name:f[1] }; });

var MODES = [
  { id:"us", name:"US shift", sub:"3:30 PM – 12:30 AM" },
  { id:"indian", name:"Indian shift", sub:"" },
  { id:"weekend", name:"Weekend", sub:"" }
];
var SEED_ROUTINES = {
  us: [
    { id:"u1", label:"Wake up", start:"08:30", end:"" },
    { id:"u2", label:"Journal", start:"08:45", end:"09:00" },
    { id:"u3", label:"Skin and hair", start:"09:00", end:"09:15" },
    { id:"u4", label:"Clean", start:"09:15", end:"09:30" },
    { id:"u5", label:"Food", start:"09:30", end:"09:45" },
    { id:"u6", label:"Gym", start:"10:00", end:"11:00" },
    { id:"u7", label:"Home", start:"11:00", end:"" },
    { id:"u8", label:"Shift", start:"15:30", end:"00:30" }
  ],
  indian:  [ { id:"i1", label:"Wake up", start:"06:00", end:"" } ],
  weekend: [ { id:"w1", label:"Wake up", start:"06:00", end:"" } ]
};
var SEED_PROMPTS = [
  "What I will learn today",
  "What I will contribute today",
  "What I enjoyed from the day before"
];

var MOODS = ["","rough","flat","steady","good","flying"];
var HIST_DAYS = 21;
var WIN_START = 5*60, WIN_END = 26*60;
var SLOT_TIME_DEFAULTS = { pregym:"09:30", afternoon:"13:00", office:"18:00", dinner:"21:00" };
var DOWS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

/* ============ storage ============ */
function read(k,fb){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):fb; }catch(e){ return fb; } }
function write(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

var DEFAULTS={ url:"", token:"", rollover:"03:00", tz:"Asia/Kolkata",
               name:"Anand", mantra:"Remember who you are" };
var cfg=Object.assign({},DEFAULTS,read("day.cfg",{}));
var lib=read("day.lib",null)||{
  foods:SEED_FOODS.slice(),
  routines:JSON.parse(JSON.stringify(SEED_ROUTINES)),
  prompts:SEED_PROMPTS.slice(),
  updated_at:new Date().toISOString()
};
var days=read("day.days",{});
var months=read("day.months",{});
var state={ view:"home", date:"", calMonth:"", calMode:"month", revRange:7, libMode:"us", plMonth:"", syncing:false };

function saveCfg(){ write("day.cfg",cfg); }
function saveDays(){ write("day.days",days); }
function saveMonths(){ write("day.months",months); }
function saveLib(){ lib.updated_at=new Date().toISOString(); write("day.lib",lib); markDirty("__lib__"); }

/* ============ dates ============ */
function pad(n){ return n<10?"0"+n:""+n; }
function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseISO(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function hm(t){ if(!t) return null; var p=t.split(":"); return (+p[0])*60+(+p[1]); }
/* The wall clock in a chosen timezone, so the app doesn't drift when this
   device is set to the shift's timezone rather than where you actually live.
   Empty tz falls back to the device. */
function nowParts(){
  var d=new Date(), tz=cfg.tz||"";
  if(!tz) return { date:iso(d), h:d.getHours(), m:d.getMinutes() };
  try{
    var p={};
    new Intl.DateTimeFormat("en-GB",{
      timeZone:tz, year:"numeric", month:"2-digit", day:"2-digit",
      hour:"2-digit", minute:"2-digit", hourCycle:"h23"
    }).formatToParts(d).forEach(function(x){ p[x.type]=x.value; });
    return { date:p.year+"-"+p.month+"-"+p.day, h:(+p.hour)%24, m:+p.minute };
  }catch(e){
    return { date:iso(d), h:d.getHours(), m:d.getMinutes() };
  }
}
function today(){
  var n=nowParts(), roll=hm(cfg.rollover)||0;
  return (n.h*60+n.m < roll) ? addDays(n.date,-1) : n.date;
}
function addDays(b,n){ var d=parseISO(b); d.setDate(d.getDate()+n); return iso(d); }
function monthKey(d){ return d.slice(0,7); }
function nowMins(){ var n=nowParts(), m=n.h*60+n.m; return m<3*60?m+1440:m; }

/* ============ model ============ */
function blank(d){ return { date:d, mode:"us", mood:0, plan:{}, ate:{}, done:[], tasks:[], journal:{}, notes:"", updated_at:"" }; }
function day(d){
  if(!days[d]) days[d]=blank(d);
  var x=days[d];
  x.plan=x.plan||{}; x.ate=x.ate||{}; x.done=x.done||[]; x.tasks=x.tasks||[]; x.journal=x.journal||{};
  x.tasks.forEach(function(t){ normTask(t,d); });
  return x;
}
function markDirty(k){
  var q=read("day.dirty",[]);
  if(q.indexOf(k)===-1){ q.push(k); write("day.dirty",q); }
  queueSync();
}
function touch(d){ day(d).updated_at=new Date().toISOString(); saveDays(); markDirty(d); }
function routineFor(d){ return lib.routines[day(d).mode]||[]; }
function slotTime(id){ return (lib.slotTimes&&lib.slotTimes[id])||SLOT_TIME_DEFAULTS[id]||"12:00"; }

/* ---- task datetimes ---- */
function dtDate(s){ return s?s.slice(0,10):""; }
function dtTime(s){ return s?s.slice(11,16):""; }
function nowDT(){ var n=nowParts(); return n.date+"T"+pad(n.h)+":"+pad(n.m); }
function dtAdd(dt,mins){
  if(!dt) return "";
  var d=parseISO(dtDate(dt)), m=hm(dtTime(dt))+mins;
  while(m>=1440){ m-=1440; d.setDate(d.getDate()+1); }
  while(m<0){ m+=1440; d.setDate(d.getDate()+(-1)); }
  return iso(d)+"T"+pad(Math.floor(m/60))+":"+pad(m%60);
}
function dayGap(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }

/* Older tasks stored a single "time"; fold them into start/end datetimes. */
function normTask(t,date){
  if(t.start===undefined||t.start===null||(!t.start&&t.time)){
    t.start = t.time ? date+"T"+t.time : "";
    t.end   = t.start ? dtAdd(t.start,30) : "";
  }
  if(t.end===undefined||t.end===null) t.end="";
  if(t.outcome===undefined) t.outcome="";
  if(t.remarks===undefined) t.remarks="";
  if(t.closedAt===undefined) t.closedAt="";
  return t;
}
function taskTimeLabel(x){
  if(!x.start) return "";
  var s=dtTime(x.start);
  if(!x.end) return s;
  var gap=dayGap(dtDate(x.start),dtDate(x.end));
  return s+" → "+dtTime(x.end)+(gap>0?" +"+gap+"d":"");
}
/* What actually happened. An explicit choice always wins over the guess. */
function taskOutcome(x){
  if(x.outcome) return x.outcome;
  if(x.done) return "ontime";
  if(x.end && x.end < nowDT()) return "missed";
  return "open";
}
var OUTCOME_LABEL={ ontime:"On time", late:"Late", missed:"Missed", open:"Open" };
function closeTask(d,x,val){
  x.done=val;
  if(val){
    x.closedAt=nowDT();
    if(!x.outcome) x.outcome=(x.end && x.closedAt>x.end)?"late":"ontime";
  } else { x.closedAt=""; x.outcome=""; }
  touch(d.date);
}
function foodName(id){ var f=lib.foods.filter(function(x){return x.id===id;})[0]; return f?f.name:id; }

/* ============ helpers ============ */
var $=function(id){ return document.getElementById(id); };
function el(t,c,x){ var e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e; }
function autosize(t){ t.style.height="auto"; t.style.height=t.scrollHeight+"px"; }
function tick(){ return '<svg viewBox="0 0 14 14"><polyline points="2,7.5 5.5,11 12,3"/></svg>'; }
function blockSpan(b){
  var s=hm(b.start); if(s===null) return null;
  if(s<WIN_START-60) s+=1440;
  var e=hm(b.end);
  if(e===null||e===hm(b.start)) e=s+15; else { if(e<WIN_START-60) e+=1440; if(e<s) e+=1440; }
  return [s,e];
}

/* ============ header + ribbon ============ */
function renderHeader(){
  var d=parseISO(state.date);
  var dn=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var mn=["January","February","March","April","May","June","July","August","September","October","November","December"];
  $("dNum").textContent=pad(d.getDate());
  $("dDow").textContent=dn[d.getDay()];
  $("dMon").textContent=mn[d.getMonth()]+" "+d.getFullYear();
  $("jump").style.visibility=state.date===today()?"hidden":"visible";
}
function renderRibbon(){
  var live=state.date===today();
  $("ribbon").setAttribute("data-live",live?"1":"0");
  var span=WIN_END-WIN_START, track=$("rtrack");
  track.innerHTML="";
  var nm=live?nowMins():null;
  routineFor(state.date).forEach(function(b){
    var sp=blockSpan(b); if(!sp) return;
    var l=(sp[0]-WIN_START)/span*100, w=(sp[1]-sp[0])/span*100;
    if(l>100||l+w<0) return;
    var seg=el("div","rblock"+(/shift/i.test(b.label)?" shift":""));
    if(nm!==null&&nm>=sp[0]&&nm<sp[1]) seg.className+=" on";
    seg.style.left=Math.max(0,l)+"%";
    seg.style.width=Math.max(.7,Math.min(100-Math.max(0,l),w))+"%";
    seg.title=b.label+" "+b.start+(b.end?"–"+b.end:"");
    track.appendChild(seg);
  });
  $("rL").textContent="05:00"; $("rR").textContent="02:00";
  if(live) $("rnow").style.left=Math.max(0,Math.min(100,(nowMins()-WIN_START)/span*100))+"%";
}

/* ============ HOME ============ */
function currentBlock(){
  var nm=nowMins(), blocks=routineFor(today()), cur=null, next=null;
  blocks.forEach(function(b){
    var sp=blockSpan(b); if(!sp) return;
    if(nm>=sp[0]&&nm<sp[1]) cur=b;
    if(sp[0]>nm && (!next||sp[0]<blockSpan(next)[0])) next=b;
  });
  return { cur:cur, next:next };
}
function renderHome(){
  var t=today(), d=day(t);
  $("greetHi").textContent = "Hi " + (cfg.name || "there");
  $("greetMantra").textContent = cfg.mantra || "";
  $("brandName").textContent = cfg.name || "Day";
  var cn=currentBlock(), hero=$("hero");
  hero.innerHTML=""; hero.className="hero"+(cn.cur?" live":"");
  if(cn.cur){
    hero.appendChild(el("div","eyebrow","Right now"));
    hero.appendChild(el("div","big",cn.cur.label));
    hero.appendChild(el("div","sub",cn.cur.start+(cn.cur.end?" – "+cn.cur.end:"")));
  } else if(cn.next){
    hero.appendChild(el("div","eyebrow","Next up"));
    hero.appendChild(el("div","big",cn.next.label));
    hero.appendChild(el("div","sub","at "+cn.next.start));
  } else {
    hero.appendChild(el("div","eyebrow","Today"));
    hero.appendChild(el("div","big","Nothing scheduled"));
    hero.appendChild(el("div","sub","Add blocks under Library"));
  }

  var blocks=routineFor(t);
  var openTasks=d.tasks.filter(function(x){return !x.done;});
  var planned=0, eaten=0;
  SLOTS.forEach(function(s){ planned+=(d.plan[s.id]||[]).length; eaten+=(d.ate[s.id]||[]).length; });

  var tiles=$("tiles"); tiles.innerHTML="";
  [[d.done.length+"/"+(blocks.length||0),"Routine done"],
   [String(openTasks.length),"Tasks open"],
   [String(journalStreak())+"d","Journal streak"]].forEach(function(p){
    var c=el("div","tile");
    c.appendChild(el("div","v",p[0]));
    c.appendChild(el("div","k",p[1]));
    tiles.appendChild(c);
  });

  var ol=$("openList"); ol.innerHTML="";
  var items=[];
  openTasks.forEach(function(x){ items.push([dtTime(x.start)||"", x.title, false]); });
  blocks.filter(function(b){ return d.done.indexOf(b.id)===-1; }).forEach(function(b){ items.push([b.start||"", b.label, true]); });
  items.sort(function(a,b){ return (a[0]||"99:99").localeCompare(b[0]||"99:99"); });
  if(!items.length) ol.appendChild(el("li","empty","All clear."));
  items.slice(0,8).forEach(function(i){
    var li=el("li");
    li.appendChild(el("span","when",i[0]||"—"));
    li.appendChild(el("span","what"+(i[2]?" dim":""),i[1]));
    ol.appendChild(li);
  });
  $("openMeta").textContent = planned? eaten+"/"+planned+" food" : "";

  var up=$("upcoming"); up.innerHTML="";
  var found=0;
  for(var i=1;i<=14&&found<6;i++){
    var dt=addDays(t,i), rec=days[dt];
    if(!rec||!rec.tasks) continue;
    rec.tasks.filter(function(x){return !x.done;}).forEach(function(x){
      if(found>=6) return;
      var li=el("li");
      var dd=parseISO(dt);
      li.appendChild(el("span","when",DOWS[(dd.getDay()+6)%7]+" "+dd.getDate()));
      li.appendChild(el("span","what",x.title+(x.start?"  "+taskTimeLabel(x):"")));
      up.appendChild(li); found++;
    });
  }
  if(!found) up.appendChild(el("li","empty","Nothing on the next two weeks. Plan it in Calendar."));

  renderWeek();
  renderHist();
}
function journalStreak(){
  var n=0, d=today();
  for(var i=0;i<400;i++){
    var r=days[d];
    var any=r&&r.journal&&Object.keys(r.journal).some(function(k){ return hasText(r.journal[k]); });
    if(!any) break;
    n++; d=addDays(d,-1);
  }
  return n;
}
function renderWeek(){
  var rd=0,rt=0,td=0,tt=0,jd=0;
  for(var i=0;i<7;i++){
    var dt=addDays(today(),-i), r=days[dt];
    if(!r) continue;
    var blocks=lib.routines[r.mode||"us"]||[];
    rt+=blocks.length; rd+=(r.done||[]).length;
    (r.tasks||[]).forEach(function(x){ tt++; if(x.done) td++; });
    if(r.journal&&Object.keys(r.journal).some(function(k){ return hasText(r.journal[k]); })) jd++;
  }
  var box=$("weekBars"); box.innerHTML="";
  [["Routine blocks",rd,rt],["Tasks",td,tt],["Days journaled",jd,7]].forEach(function(p){
    var pct=p[2]?Math.round(p[1]/p[2]*100):0;
    var row=el("div"); row.style.marginBottom="14px";
    var top=el("div"); top.style.cssText="display:flex;justify-content:space-between;font-size:13.5px";
    top.appendChild(el("span",null,p[0]));
    top.appendChild(el("span",null,p[1]+" / "+p[2]));
    var bar=el("div","bar"); var fill=el("i"); fill.style.width=pct+"%"; bar.appendChild(fill);
    row.appendChild(top); row.appendChild(bar); box.appendChild(row);
  });
  $("weekMeta").textContent="last 7 days";
}
function renderHist(){
  var box=$("hist"); box.innerHTML="";
  var start=addDays(today(),-(HIST_DAYS-1));
  for(var i=0;i<HIST_DAYS;i++){
    var dt=addDays(start,i), rec=days[dt];
    var b=el("button","hcell"+(dt===state.date?" sel":""));
    if(rec&&rec.mood) b.dataset.m=rec.mood;
    b.title=parseISO(dt).toDateString()+(rec&&rec.mood?" — "+MOODS[rec.mood]:"");
    b.setAttribute("aria-label",b.title);
    (function(x){ b.addEventListener("click",function(){ state.date=x; setView("today"); }); })(dt);
    box.appendChild(b);
  }
  var mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var f=parseISO(start), t=parseISO(today());
  $("histL").textContent=mo[f.getMonth()]+" "+f.getDate();
  $("histR").textContent=mo[t.getMonth()]+" "+t.getDate();
}

/* ============ TODAY ============ */
function renderPrompt(){
  if(state.date!==today()){ $("prompt").textContent="How was this day?"; return; }
  var m=nowMins(), t;
  if(m<10*60) t="Morning. How's it starting?";
  else if(m<15*60+30) t="Before the shift — where are you at?";
  else if(m<20*60) t="Shift's on. How's it going?";
  else if(m<24*60) t="Back nine. How's it holding up?";
  else t="Wrapping up. How did it land?";
  $("prompt").textContent=t;
}
function renderMood(){
  var d=day(state.date), box=$("dots");
  if(!box.children.length){
    for(var i=1;i<=5;i++){
      var b=el("button","dot"); b.dataset.m=i; b.setAttribute("aria-label",MOODS[i]);
      b.addEventListener("click",function(e){
        var v=+e.currentTarget.dataset.m, dd=day(state.date);
        dd.mood=dd.mood===v?0:v; touch(state.date); renderMood(); renderHist();
      });
      box.appendChild(b);
    }
  }
  Array.prototype.forEach.call(box.children,function(b){
    b.setAttribute("aria-pressed",(+b.dataset.m===d.mood)?"true":"false");
  });
  $("moodWord").textContent=d.mood?MOODS[d.mood]:"";
}
var openEditor = null;   // id of the task whose editor is expanded

function taskRow(d,x,after){
  var li=el("li","tk"+(x.done?" done":"")+(openEditor===x.id?" open-ed":""));
  var chk=el("button","chk"); chk.innerHTML=tick();
  chk.setAttribute("aria-pressed",x.done?"true":"false");
  chk.setAttribute("aria-label",(x.done?"Reopen: ":"Close: ")+x.title);
  chk.addEventListener("click",function(){ closeTask(d,x,!x.done); after(); });

  var tt=el("div","tt");
  tt.appendChild(el("div","tl",x.title));
  var lbl=taskTimeLabel(x);
  if(lbl) tt.appendChild(el("div","tm",lbl));
  var oc=taskOutcome(x);
  if(oc!=="open"||x.remarks){
    var b=el("div");
    if(oc!=="open") b.appendChild(el("span","badge "+oc,OUTCOME_LABEL[oc]));
    tt.appendChild(b);
  }

  var ed=el("button","edit","⋯"); ed.title="Edit, remarks, outcome";
  ed.addEventListener("click",function(){
    openEditor = (openEditor===x.id) ? null : x.id;
    after();
  });
  var k=el("button","kill","×"); k.title="Delete";
  k.addEventListener("click",function(){
    d.tasks=d.tasks.filter(function(o){return o.id!==x.id;});
    days[d.date].tasks=d.tasks;
    if(openEditor===x.id) openEditor=null;
    touch(d.date); after();
  });

  li.appendChild(chk); li.appendChild(tt); li.appendChild(ed); li.appendChild(k);
  return li;
}

function taskEditor(d,x,after){
  var w=el("li"); w.style.listStyle="none";
  var box=el("div","tked");

  function field(parent,label,node){
    var c=el("div"); c.appendChild(el("label",null,label)); c.appendChild(node); parent.appendChild(c); return node;
  }
  var r0=el("div","fr");
  var ti=el("input"); ti.type="text"; ti.value=x.title;
  ti.addEventListener("input",function(){ x.title=ti.value; touch(d.date); });
  field(r0,"Task",ti);
  box.appendChild(r0);

  var r1=el("div","fr");
  var s=el("input"); s.type="datetime-local"; s.value=x.start||"";
  s.addEventListener("change",function(){
    x.start=s.value;
    if(x.start&&(!x.end||x.end<x.start)) x.end=dtAdd(x.start,30);
    touch(d.date); after();
  });
  field(r1,"Starts",s);
  var e=el("input"); e.type="datetime-local"; e.value=x.end||"";
  e.addEventListener("change",function(){ x.end=e.value; touch(d.date); after(); });
  field(r1,"Ends",e);
  box.appendChild(r1);

  var r2=el("div","fr");
  var sel=el("select");
  [["","— not set —"],["ontime","Completed on time"],["late","Completed late"],["missed","Missed"]]
    .forEach(function(o){ var op=el("option",null,o[1]); op.value=o[0]; sel.appendChild(op); });
  sel.value=x.outcome||"";
  sel.addEventListener("change",function(){
    x.outcome=sel.value;
    if(sel.value==="ontime"||sel.value==="late"){
      if(!x.done) closeTask(d,x,true);
      x.outcome=sel.value;
    } else if(sel.value==="missed"){
      if(x.done) closeTask(d,x,false);
      x.outcome="missed";
    }
    touch(d.date); after();
  });
  field(r2,"How it went",sel);
  box.appendChild(r2);

  var r3=el("div","fr");

/* ============ rich text ============ */
function cleanHTML(h){
  return String(h==null?"":h)
    .replace(/<\s*script[\s\S]*?<\s*\/\s*script\s*>/gi,"")
    .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi,"")
    .replace(/javascript:/gi,"");
}
function escHTML(s){
  return String(s).replace(/[&<>]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; });
}
/* Entries written before rich text was added are plain strings. */
function toRich(v){
  if(!v) return "";
  if(/<(p|div|ul|ol|li|br|b|i|strong|em|input)\b/i.test(v)) return cleanHTML(v);
  return escHTML(v).replace(/\n/g,"<br>");
}
/* Real words, ignoring markup — <br> alone is still an empty field. */
function hasText(v){
  if(!v) return false;
  if(/<input|<li\b/i.test(v)) return true;
  return String(v).replace(/<[^>]*>/g," ").replace(/&nbsp;/gi," ").trim().length > 0;
}

/**
 * A small editor supporting bold, bullets, numbers and checkboxes.
 * set(html) is called whenever the content actually changes.
 */
function richField(placeholder, set, extraClass){
  var wrap=el("div"), bar=el("div","rtbar"), ed=el("div","rt"+(extraClass?" "+extraClass:""));
  ed.contentEditable="true";
  ed.setAttribute("role","textbox");
  ed.setAttribute("aria-multiline","true");
  ed.dataset.ph=placeholder||"";

  var last=null, timer=null;

  function save(){
    var h=cleanHTML(ed.innerHTML);
    if(h===last) return false;
    last=h; set(h); touch(state.date); return true;
  }
  function saveSoon(){ clearTimeout(timer); timer=setTimeout(save,600); }

  function ancestor(tags){
    var s=window.getSelection();
    if(!s || !s.rangeCount) return null;
    var n=s.getRangeAt(0).startContainer;
    while(n && n!==ed){
      if(n.nodeType===1 && tags.indexOf(n.tagName)>-1) return n;
      n=n.parentNode;
    }
    return null;
  }
  function addBoxes(l){
    Array.prototype.forEach.call(l.children,function(li){
      if(li.querySelector('input[type="checkbox"]')) return;
      var cb=document.createElement("input");
      cb.type="checkbox"; cb.setAttribute("contenteditable","false");
      li.insertBefore(cb,li.firstChild);
    });
  }
  function stripBoxes(l){
    Array.prototype.forEach.call(l.querySelectorAll('input[type="checkbox"]'),function(c){
      c.parentNode.removeChild(c);
    });
  }
  function toChecklist(){
    var l=ancestor(["UL","OL"]);
    if(l && l.tagName==="UL" && l.classList.contains("cl")){
      stripBoxes(l); l.classList.remove("cl");
      document.execCommand("insertUnorderedList");
      return;
    }
    if(!l || l.tagName!=="UL"){ document.execCommand("insertUnorderedList"); l=ancestor(["UL"]); }
    if(l && l.tagName==="UL"){ l.classList.add("cl"); addBoxes(l); }
  }
  function plainList(cmd){
    var l=ancestor(["UL","OL"]);
    if(l && l.classList.contains("cl")){ stripBoxes(l); l.classList.remove("cl"); }
    document.execCommand(cmd);
  }
  function tidy(){
    Array.prototype.forEach.call(ed.querySelectorAll("ul.cl"),addBoxes);
    if(!ed.textContent.trim() && !ed.querySelector("input,li")) ed.innerHTML="";
  }

  function button(icon,label,fn){
    var b=el("button"); b.type="button"; b.innerHTML=RT_ICONS[icon];
    b.title=label; b.setAttribute("aria-label",label);
    b.addEventListener("mousedown",function(e){ e.preventDefault(); });  // don't drop the selection
    b.addEventListener("click",function(){ ed.focus(); fn(); tidy(); save(); refresh(); });
    bar.appendChild(b);
    return b;
  }
  var bB=button("bold","Bold",function(){ document.execCommand("bold"); });
  var bU=button("ul","Bulleted list",function(){ plainList("insertUnorderedList"); });
  var bO=button("ol","Numbered list",function(){ plainList("insertOrderedList"); });
  var bC=button("cl","Checklist",toChecklist);

  function refresh(){
    try{
      bB.classList.toggle("on",document.queryCommandState("bold"));
      var l=ancestor(["UL","OL"]);
      var chk=!!(l && l.tagName==="UL" && l.classList.contains("cl"));
      bU.classList.toggle("on",!!(l&&l.tagName==="UL")&&!chk);
      bO.classList.toggle("on",!!(l&&l.tagName==="OL"));
      bC.classList.toggle("on",chk);
    }catch(e){}
  }

  ed.addEventListener("input",function(){ tidy(); saveSoon(); refresh(); });
  ed.addEventListener("blur",function(){ clearTimeout(timer); tidy(); save(); });
  ed.addEventListener("keyup",refresh);
  ed.addEventListener("mouseup",refresh);
  ed.addEventListener("focus",refresh);

  ed.addEventListener("paste",function(e){
    e.preventDefault();
    var t=((e.clipboardData||window.clipboardData).getData("text/plain")||"");
    document.execCommand("insertText",false,t);
  });

  ed.addEventListener("click",function(e){
    var t=e.target;
    if(t && t.tagName==="INPUT" && t.type==="checkbox"){
      if(t.checked) t.setAttribute("checked",""); else t.removeAttribute("checked");
      save();
    }
  });

  // Enter inside a checklist continues the list; Enter on an empty item leaves it
  ed.addEventListener("keydown",function(e){
    if(e.key!=="Enter"||e.shiftKey) return;
    var li=ancestor(["LI"]);
    if(!li || !li.parentNode.classList.contains("cl")) return;
    e.preventDefault();
    if(!li.textContent.trim()){
      var l=li.parentNode;
      stripBoxes(l); l.classList.remove("cl");
      document.execCommand("insertUnorderedList");
      tidy(); save(); return;
    }
    var nl=document.createElement("li");
    var cb=document.createElement("input");
    cb.type="checkbox"; cb.setAttribute("contenteditable","false");
    nl.appendChild(cb);
    li.parentNode.insertBefore(nl,li.nextSibling);
    var r=document.createRange();
    r.setStart(nl,nl.childNodes.length); r.collapse(true);
    var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
    save();
  });

  wrap.appendChild(bar); wrap.appendChild(ed);
  return {
    wrap:wrap, ed:ed,
    setValue:function(html){
      var h=cleanHTML(html||"");
      if(h===ed.innerHTML) { last=h; return; }
      ed.innerHTML=h; last=h;
    }
  };
}

var PXPM = 1.05;   // pixels per minute in the day grid

function renderCalendar(){
  var isDay = state.calMode === "day";
  $("monthWrap").style.display = isDay ? "none" : "";
  $("dayWrap").style.display   = isDay ? "" : "none";
  Array.prototype.forEach.call($("calSeg").children, function(b){
    b.setAttribute("aria-pressed", b.dataset.c === state.calMode ? "true" : "false");
  });

  if(isDay){
    var dd = parseISO(state.date);
    var mn = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    $("mLab").textContent = DOWS[(dd.getDay()+6)%7] + " " + dd.getDate() + " " + mn[dd.getMonth()];
    $("mToday").textContent = "Today";
    renderDayGrid();

function renderDayGrid(){
  var g = $("dayGrid"), d = day(state.date);
  g.innerHTML = "";
  g.style.height = ((WIN_END - WIN_START) * PXPM) + "px";

  for(var m = WIN_START; m <= WIN_END; m += 60){
    var y = (m - WIN_START) * PXPM;
    var ln = el("div","dgline"); ln.style.top = y + "px"; g.appendChild(ln);
    var h  = el("div","dgh", pad(Math.floor(m/60) % 24) + ":00"); h.style.top = y + "px"; g.appendChild(h);
  }

  routineFor(state.date).forEach(function(b){
    var sp = blockSpan(b); if(!sp) return;
    var box = el("div","dgb rt" + (d.done.indexOf(b.id) > -1 ? " done" : ""));
    box.style.top = ((sp[0] - WIN_START) * PXPM) + "px";
    box.style.height = Math.max(19, (sp[1] - sp[0]) * PXPM - 2) + "px";
    box.appendChild(el("div","bl", b.label));
    if((sp[1] - sp[0]) >= 30) box.appendChild(el("div","bt", b.start + (b.end ? "–" + b.end : "")));
    box.title = b.label + " " + b.start + (b.end ? "–" + b.end : "");
    g.appendChild(box);
  });

  var right = [];
  SLOTS.forEach(function(s){
    var ids = d.plan[s.id] || [];
    if(!ids.length) return;
    right.push({ time:slotTime(s.id), mins:30, cls:"meal", label:s.name, sub:ids.map(foodName).join(", ") });
  });
  (d.tasks || []).forEach(function(x){
    if(!x.start || dtDate(x.start) !== state.date) return;
    var mins = 30;
    if(x.end){
      var span = hm(dtTime(x.end)) + 1440 * dayGap(dtDate(x.start), dtDate(x.end)) - hm(dtTime(x.start));
      if(span > 0) mins = span;
    }
    right.push({ time:dtTime(x.start), mins:mins, cls:"task" + (x.done ? " done" : ""),
                 label:x.title, sub:taskTimeLabel(x) });
  });

  right.forEach(function(r){
    var s = hm(r.time); if(s === null) return;
    if(s < WIN_START - 60) s += 1440;
    if(s < WIN_START || s > WIN_END) return;
    var box = el("div","dgb " + r.cls);
    box.style.top = ((s - WIN_START) * PXPM) + "px";
    box.style.height = Math.max(19, Math.min((WIN_END-s), (r.mins||30)) * PXPM - 2) + "px";
    box.appendChild(el("div","bl", r.label));
    box.appendChild(el("div","bt", r.sub));
    box.title = r.label + " — " + r.sub;
    g.appendChild(box);
  });

  if(state.date === today()){
    var n = nowMins();
    if(n >= WIN_START && n <= WIN_END){
      var nl = el("div","dgnow");
      nl.style.top = ((n - WIN_START) * PXPM) + "px";
      g.appendChild(nl);
    }
  }
}

function sortBlocks(){
  var b=lib.routines[state.libMode]||[];
  b.sort(function(x,y){

    return a-c;
  });
}

/* ============ monthly planner ============ */
var PLAN_TARGETS={ podcasts:4, shoots:4, gym:20 };
function uid(p){ return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function blankMonth(k){
  return { month:k, books:[], projects:[], podcasts:[], shoots:[],
           gym:{ target:PLAN_TARGETS.gym, wStart:"", wNow:"", wTarget:"" },
           money:{ income:"", saveTarget:"", saveActual:"", cats:[] },
           podTarget:PLAN_TARGETS.podcasts, shootTarget:PLAN_TARGETS.shoots,
           updated_at:"" };
}
function month(k){
  if(!months[k]) months[k]=blankMonth(k);
  var m=months[k];
  m.books=m.books||[]; m.projects=m.projects||[]; m.podcasts=m.podcasts||[]; m.shoots=m.shoots||[];
  m.projects.forEach(function(p){ p.steps=p.steps||[]; });
  m.gym=m.gym||{}; if(m.gym.target===undefined) m.gym.target=PLAN_TARGETS.gym;
  m.money=m.money||{}; m.money.cats=m.money.cats||[];
  if(m.podTarget===undefined)   m.podTarget=PLAN_TARGETS.podcasts;
  if(m.shootTarget===undefined) m.shootTarget=PLAN_TARGETS.shoots;
  return m;
}
function touchMonth(k){
  month(k).updated_at=new Date().toISOString();
  saveMonths(); markDirty("__month__:"+k);
}
function monthLabel(k){
  var d=new Date(+k.slice(0,4),+k.slice(5,7)-1,1);
  return d.toLocaleDateString(undefined,{month:"long",year:"numeric"});
}
function stepMonth(k,dir){
  return iso(new Date(+k.slice(0,4),+k.slice(5,7)-1+dir,1)).slice(0,7);
}
function num(v){ var n=parseFloat(String(v==null?"":v).replace(/[^0-9.\-]/g,"")); return isFinite(n)?n:0; }
function money(n){
  var neg=n<0; n=Math.round(Math.abs(n));
  return (neg?"-":"")+"\u20B9"+n.toLocaleString("en-IN");
}
/* Sessions are not logged twice: this counts the days you already ticked the
   Gym block on the routine, whichever mode that day was in. */
function gymSessions(k){
  var n=0, last=new Date(+k.slice(0,4),+k.slice(5,7),0).getDate();
  for(var i=1;i<=last;i++){
    var d=days[k+"-"+pad(i)]; if(!d) continue;
    var blocks=lib.routines[d.mode||"us"]||[], done=d.done||[];
    for(var j=0;j<blocks.length;j++){
      if(/gym/i.test(blocks[j].label||"")&&done.indexOf(blocks[j].id)>-1){ n++; break; }
    }
  }
  return n;
}
function plTile(v,k,ratio){

  t.appendChild(el("div","v",v));
  t.appendChild(el("div","k",k));

/* One editable text line + optional second line, with a remove button. */
function plRow(opts){
